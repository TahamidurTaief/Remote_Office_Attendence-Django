{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 Page Not Found | FieldTrack</title>
  {% load tailwind_cli %}{% tailwind_css %}
</head>
<body class="ft-page-bg antialiased flex items-center justify-center min-h-screen">
  <div class="p-8 text-center">
    <p class="text-6xl font-black text-primary-500 mb-4">404</p>
    <h1 class="text-2xl font-bold mb-2" style="color:var(--text)">Page Not Found</h1>
    <p class="mb-6" style="color:var(--text-secondary)">The page you are looking for doesn't exist or has been moved.</p>
    <a href="/" class="bg-primary text-white px-6 py-3 rounded-xl font-bold hover:opacity-90">Go Home</a>
  </div>
</body>
</html>
