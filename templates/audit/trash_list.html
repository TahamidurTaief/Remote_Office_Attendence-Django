<c-app-shell page_title="Trash | FieldTrack" active_href="{% url 'audit:trash_list' %}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{% url 'audit:trash_list' %}"></c-sidebar>
    </c-slot>


    <c-command-palette></c-command-palette>

    <div class="p-4 lg:p-6 w-full space-y-4">
        <c-page-header title="Recycle Bin / Trash" subtitle="Soft-deleted database records and restoration repository">
            <c-slot name="actions">
                <form method="post" action="{% url 'audit:trash_bulk' %}" class="inline" x-data @submit.prevent="window.confirmAction('Are you sure you want to completely empty the trash? This action cannot be undone.', () => $el.submit())">
                {% csrf_token %}
                <input type="hidden" name="bulk_action" value="empty_trash">
                <c-button type="submit" variant="danger" icon="trash" label="Empty Trash" size="sm" extra_class="!bg-red-600 hover:!bg-red-700 !text-white"></c-button>
                </form>
            </c-slot>
        </c-page-header>
        <!-- Filter Bar -->
        <c-card padding="sm">
            <c-filter-bar method="get" action="{% url 'audit:trash_list' %}" hx-get="{% url 'audit:trash_list' %}" hx-target="#trash-table-container" hx-trigger="keyup changed delay:300ms from:input, change from:select">
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 flex-1 items-end">
                    <c-input type="text" name="q" label="Search" value="{{ search_query }}" placeholder="Search record..." icon="search"></c-input>
                    <c-input type="text" name="module" label="Module" value="{{ module_filter }}" placeholder="e.g. employees"></c-input>
                    <c-input type="text" name="deleted_by" label="Deleted By" value="{{ deleted_by_filter }}" placeholder="Email..."></c-input>
                    <c-select name="status" label="Status" value="{{ status_filter }}">
                        <option value="active">Active (Deleted)</option>
                        <option value="restored">Restored</option>
                        <option value="purged">Permanently Deleted</option>
                    </c-select>
                </div>
            </c-filter-bar>
        </c-card>

        <!-- Table Container -->
        <div id="trash-table-container">
            {% include "audit/partials/trash_table.html" %}
        </div>
    </div>

    <!-- Container for HTMX loaded modals -->
    <div id="modal-container"></div>
</c-app-shell>
