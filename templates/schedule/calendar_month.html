<c-app-shell page_title="Calendar | FieldTrack" active_href="{{ request.path }}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{{ request.path }}"></c-sidebar>
    </c-slot>

    <c-slot name="topbar">
        <c-topbar title="Calendar">
            <c-slot name="actions">
                {% if is_admin_or_manager %}
                <c-button href="{% url 'schedule:create' %}"
                          variant="accent"
                          icon="plus"
                          label="Add Event"></c-button>
                {% endif %}
            </c-slot>
        </c-topbar>
    </c-slot>

    <c-command-palette></c-command-palette>

    <c-page-container>
        <div id="calendar-view-container">
            {% include 'schedule/partials/calendar_content.html' %}
        </div>
    </c-page-container>
</c-app-shell>
