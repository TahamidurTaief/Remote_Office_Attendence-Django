<div id="employee-kpi-container" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <c-kpi-widget title="Total Master Employees" value="{{ master_stats.total|default:0 }}" subtitle="All master records" icon="user-group" variant="primary" />
        <c-kpi-widget title="Active Employees" value="{{ master_stats.active|default:0 }}" subtitle="Login & active status" icon="user-check" variant="success" />
        <c-kpi-widget title="Probation Employees" value="{{ master_stats.probation|default:0 }}" subtitle="Under evaluation" icon="clock" variant="warning" />
        <c-kpi-widget title="Notice Period" value="{{ master_stats.notice|default:0 }}" subtitle="Transitioning" icon="alert-triangle" variant="danger" />
    </div>

    {% if dept_summary %}
    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
        <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Department Headcount Breakdown</h4>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
            {% for d in dept_summary %}
            <div class="p-2.5 bg-gray-50 rounded-xl">
                <div class="text-xs text-gray-500 truncate">{{ d.name }}</div>
                <div class="text-base font-bold text-gray-900 font-mono">{{ d.emp_count }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
