<div class="flex items-center gap-2 mb-4">
  <c-tab-button href="?status=" hx-get="?status=" hx-target="#login-activity-container" hx-push-url="true" active="{% if not status_filter %}true{% endif %}" label="All" color="blue"></c-tab-button>
  <c-tab-button href="?status=success" hx-get="?status=success" hx-target="#login-activity-container" hx-push-url="true" active="{% if status_filter == 'success' %}true{% endif %}" label="Success" color="emerald"></c-tab-button>
  <c-tab-button href="?status=failed" hx-get="?status=failed" hx-target="#login-activity-container" hx-push-url="true" active="{% if status_filter == 'failed' %}true{% endif %}" label="Failed" color="amber"></c-tab-button>
  <c-tab-button href="?status=locked" hx-get="?status=locked" hx-target="#login-activity-container" hx-push-url="true" active="{% if status_filter == 'locked' %}true{% endif %}" label="Locked" color="rose"></c-tab-button>
</div>

<c-audit-table type="login" logs="{{ activities }}"></c-audit-table>
