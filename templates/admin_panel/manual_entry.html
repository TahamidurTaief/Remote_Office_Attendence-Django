<c-app-shell page_title="Manual Attendance Entry | FieldTrack Admin" active_href="{{ request.path }}">

<div class="p-4 max-w-2xl mx-auto space-y-4">

    <!-- Page header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-[14px] font-semibold" style="color:var(--text)">Manual Attendance Entry</h1>
            <p class="text-[12px] mt-0.5" style="color:var(--text-muted)">Override or add missing attendance records.</p>
        </div>
        <c-button href="{% url 'admin_panel:attendance_list' %}" variant="secondary" icon="arrow-left" label="Back" ></c-button>
    </div>

    <!-- Form card -->
    <c-card padding="md">
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            {% if form.errors %}
            <div class="rounded-[4px] p-3 border" style="background:rgba(228,30,63,0.06); border-color:rgba(228,30,63,0.25);">
                <div class="flex items-center gap-2 text-[12px] font-semibold" style="color:#E41E3F">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                    Please fix the errors below.
                </div>
                <div class="mt-1 text-[12px]" style="color:#E41E3F">{{ form.non_field_errors }}</div>
            </div>
            {% endif %}

            <!-- Employee -->
            <c-select name="employee" label="Employee" is_django_form="true" error="{{ form.employee.errors.0 }}" required="true">
                {{ form.employee }}
            </c-select>

            <!-- Date -->
            <c-datetime-picker name="date" label="Date" value="{{ form.date.value|default:'' }}"
                               error="{{ form.date.errors.0 }}" required="true" ></c-datetime-picker>

            <!-- Check In / Check Out Times -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <c-datetime-picker name="check_in_time" label="Check In Time" value="{{ form.check_in_time.value|default:'' }}"
                                   time="true" error="{{ form.check_in_time.errors.0 }}" ></c-datetime-picker>
                <c-datetime-picker name="check_out_time" label="Check Out Time" value="{{ form.check_out_time.value|default:'' }}"
                                   time="true" error="{{ form.check_out_time.errors.0 }}" ></c-datetime-picker>
            </div>

            <!-- Type / Status -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <c-select name="type" label="Type" is_django_form="true" error="{{ form.type.errors.0 }}">
                    {{ form.type }}
                </c-select>
                <c-select name="status" label="Status" is_django_form="true" error="{{ form.status.errors.0 }}">
                    {{ form.status }}
                </c-select>
            </div>

            <!-- Admin Override Reason -->
            <c-textarea name="admin_override_reason"
                        label="{{ form.admin_override_reason.label }}"
                        value="{{ form.admin_override_reason.value|default:'' }}"
                        error="{{ form.admin_override_reason.errors.0 }}" ></c-textarea>

            <!-- Submit -->
            <div class="pt-3 flex justify-end border-t" style="border-color:var(--border)">
                <c-button type="submit" variant="primary" icon="save" label="Save Record" ></c-button>
            </div>
        </form>
    </c-card>
</div>

</c-app-shell>
