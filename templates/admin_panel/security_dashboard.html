<c-app-shell page_title="Security Dashboard | FieldTrack" shell_type="admin" active_href="{{ request.path }}">
  <c-slot name="sidebar">
    <c-sidebar active_href="{{ request.path }}" ></c-sidebar>
  </c-slot>


  <c-command-palette></c-command-palette>

  <div class="p-4 space-y-4 max-w-7xl mx-auto">
    <c-page-header title="Security & Session Governance" subtitle="Real-time session control, locked user monitoring, and security activity timeline.">
      <c-slot name="actions">
        <button type="button"
        hx-get="{% url 'admin_panel:security_dashboard' %}"
        hx-target="#security-dashboard-container"
        hx-swap="outerHTML"
        class="ft-btn ft-btn-secondary ft-btn-sm text-xs flex items-center gap-1.5">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Live Data
        </button>
      </c-slot>
    </c-page-header>

    {% include "admin_panel/security_dashboard_partial.html" %}

  </div>
</c-app-shell>
