<c-app-shell page_title="Login Activity Log | FieldTrack" shell_type="admin" active_href="{{ request.path }}">
  <c-slot name="sidebar">
    <c-sidebar active_href="{{ request.path }}" ></c-sidebar>
  </c-slot>

  <c-slot name="topbar">
    <c-topbar title="Login Activity Log" ></c-topbar>
  </c-slot>

  <c-command-palette></c-command-palette>

  <div class="p-4 space-y-4 max-w-7xl mx-auto">
    <c-card title="Login Security & Audit Trail" subtitle="Recent authentication attempts, status, and IP logs.">
      <div class="flex items-center gap-2 mb-4">
        <c-button href="?status=" variant="{% if not status_filter %}primary{% else %}ghost{% endif %}" label="All" size="sm"></c-button>
        <c-button href="?status=success" variant="{% if status_filter == 'success' %}primary{% else %}ghost{% endif %}" extra_class="{% if status_filter == 'success' %}!bg-emerald-600 !border-emerald-600 hover:!bg-emerald-700 text-white{% endif %}" label="Success" size="sm"></c-button>
        <c-button href="?status=failed" variant="{% if status_filter == 'failed' %}primary{% else %}ghost{% endif %}" extra_class="{% if status_filter == 'failed' %}!bg-amber-500 !border-amber-500 hover:!bg-amber-600 text-white{% endif %}" label="Failed" size="sm"></c-button>
        <c-button href="?status=locked" variant="{% if status_filter == 'locked' %}primary{% else %}ghost{% endif %}" extra_class="{% if status_filter == 'locked' %}!bg-rose-600 !border-rose-600 hover:!bg-rose-700 text-white{% endif %}" label="Locked" size="sm"></c-button>
      </div>

      <c-audit-table type="login" logs="{{ activities }}"></c-audit-table>
    </c-card>
  </div>
</c-app-shell>
