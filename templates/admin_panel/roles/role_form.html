<c-app-shell page_title="{% if object %}Edit Role: {{ object.name }}{% else %}Add Role{% endif %} | FieldTrack" active_href="{{ request.path }}">
<div class="p-4 max-w-xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-[14px] font-semibold text-gray-900">
            {% if object %}Rename Role: {{ object.name }}{% else %}Create New Role{% endif %}
        </h2>
        <a href="{% url 'admin_panel:role_list' %}" class="flex items-center gap-2 px-3 py-1.5 border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium rounded-lg transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to List
        </a>
    </div>

    <div class="bg-white shadow-sm border border-gray-150 rounded-xl p-6">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_name" class="block text-xs font-semibold text-gray-500 uppercase mb-2">Role Name</label>
                <input type="text" name="name" id="id_name" value="{{ form.name.value|default:'' }}" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="e.g. Project Supervisor">
                {% if form.name.errors %}
                <p class="text-red-500 text-xs mt-1">{{ form.name.errors.0 }}</p>
                {% endif %}
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <a href="{% url 'admin_panel:role_list' %}" class="px-4 py-2 border rounded-lg text-gray-700 bg-gray-50 hover:bg-gray-100 text-xs font-medium transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-4 py-2 bg-primary-gradient text-white font-medium rounded-lg text-xs hover:opacity-90 transition-opacity">
                    {% if object %}Save Changes{% else %}Create Role{% endif %}
                </button>
</c-app-shell>
