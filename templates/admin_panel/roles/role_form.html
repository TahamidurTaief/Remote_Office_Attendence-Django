<c-app-shell page_title="{% if object %}Edit Role: {{ object.name }}{% else %}Add Role{% endif %} | FieldTrack" active_href="{{ request.path }}">

<div class="p-4 max-w-xl mx-auto space-y-4">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-[14px] font-semibold" style="color:var(--text)">
                {% if object %}Rename Role: {{ object.name }}{% else %}Create New Role{% endif %}
            </h1>
            <p class="text-[12px] mt-0.5" style="color:var(--text-muted)">Manage role name and assignments.</p>
        </div>
        <c-button href="{% url 'admin_panel:role_list' %}" variant="secondary" icon="arrow-left" label="Back to List" />
    </div>

    <c-card padding="md">
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <!-- Role Name -->
            <div>
                <label for="id_name" class="ft-label">Role Name</label>
                <input type="text" name="name" id="id_name"
                       value="{{ form.name.value|default:'' }}" required
                       placeholder="e.g. Project Supervisor"
                       class="ft-input w-full mt-1">
                {% if form.name.errors %}
                <p class="ft-error-text">{{ form.name.errors.0 }}</p>
                {% endif %}
            </div>

            <!-- Actions -->
            <div class="pt-3 flex justify-end gap-2 border-t" style="border-color:var(--border)">
                <c-button href="{% url 'admin_panel:role_list' %}" variant="secondary" label="Cancel" />
                <c-button type="submit" variant="primary" icon="save"
                          label="{% if object %}Save Changes{% else %}Create Role{% endif %}" />
            </div>
        </form>
    </c-card>

</div>
</c-app-shell>
