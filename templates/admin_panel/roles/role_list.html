<c-app-shell page_title="Roles & Access | FieldTrack" active_href="{{ request.path }}">

<div class="p-4 max-w-5xl mx-auto space-y-4">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-[14px] font-semibold" style="color:var(--text)">Roles & Access Control</h1>
            <p class="text-[12px] mt-0.5" style="color:var(--text-muted)">Create and manage permission groups for your team.</p>
        </div>
        <c-button href="{% url 'admin_panel:role_create' %}" variant="accent" icon="plus" label="Add Role" ></c-button>
    </div>

    <!-- Table -->
    <c-table id="roles-table">
        <c-slot name="header">
            <th>Role / Group Name</th>
            <th>Members</th>
            <th class="text-right">Actions</th>
        </c-slot>

        <c-slot name="body">
            {% for role in roles %}
            <tr>
                <td>
                    <span class="font-semibold text-[12px]" style="color:var(--text)">{{ role.name }}</span>
                </td>
                <td>
                    <a href="{% url 'admin_panel:role_members' role.pk %}"
                       class="text-[12px] hover:underline" style="color:var(--primary)">
                        {{ role.user_set.count }} members
                    </a>
                </td>
                <td class="text-right">
                    <div class="flex items-center justify-end gap-1">
                        <!-- Permissions -->
                        <a href="{% url 'admin_panel:role_permissions' role.pk %}"
                           title="Manage Permissions"
                           class="ft-btn ft-btn-ghost ft-btn-sm p-1" style="color:var(--primary)">
                            <i data-lucide="shield" class="w-3.5 h-3.5"></i>
                        </a>
                        <!-- Rename -->
                        <a href="{% url 'admin_panel:role_edit' role.pk %}"
                           title="Rename"
                           class="ft-btn ft-btn-ghost ft-btn-sm p-1">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </a>
                        <!-- Clone -->
                        <div x-data="{ open: false }" class="inline">
                            <button type="button" @click="open = !open"
                                    class="ft-btn ft-btn-ghost ft-btn-sm p-1" title="Clone Role">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            </button>
                            <!-- Clone Modal -->
                            <div x-show="open" x-cloak
                                 class="fixed inset-0 z-50 flex items-center justify-center"
                                 style="background:rgba(0,0,0,0.4)">
                                <div class="rounded-xl p-5 w-80 shadow-xl"
                                     style="background:var(--surface); border:1px solid var(--border)"
                                     @click.away="open = false">
                                    <h3 class="text-[13px] font-bold mb-3" style="color:var(--text)">Clone Role: {{ role.name }}</h3>
                                    <form action="{% url 'admin_panel:role_clone' role.pk %}" method="POST">
                                        {% csrf_token %}
                                        <label class="ft-label">New Role Name</label>
                                        <input type="text" name="name" x-ref="nameInput"
                                               placeholder="Enter new role name"
                                               class="ft-input w-full mt-1 mb-3"
                                               @vue:mounted="$nextTick(() => $el.focus())">
                                        <div class="flex justify-end gap-2">
                                            <c-button type="button" variant="secondary" size="sm" label="Cancel" attrs="@click='open = false'" ></c-button>
                                            <c-button type="submit" variant="primary" size="sm" label="Clone" ></c-button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <!-- Delete -->
                        <form action="{% url 'admin_panel:role_delete' role.pk %}" method="POST" class="inline"
                              x-data @submit.prevent="window.confirmAction('Are you sure you want to delete this role?', () => $el.submit())">
                            {% csrf_token %}
                            <button type="submit" class="ft-btn ft-btn-ghost ft-btn-sm p-1 text-red-500 hover:text-red-600" title="Delete">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="py-12">
                    <c-empty-state icon="shield-alert" title="No Roles Defined"
                                   description="Create a new role to assign permissions." ></c-empty-state>
                </td>
            </tr>
            {% endfor %}
        </c-slot>
    </c-table>

</div>
</c-app-shell>
