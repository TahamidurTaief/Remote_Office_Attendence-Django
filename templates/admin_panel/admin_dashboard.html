<c-app-shell page_title="Dashboard | FieldTrack Admin" active_href="{{ request.path }}" pending_leave_count="{{ pending_leave_count }}" unread_notifications="{{ unread_notifications }}" expired_data_count="{{ expired_data_count }}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{{ request.path }}" pending_leave_count="{{ pending_leave_count }}" unread_notifications="{{ unread_notifications }}" expired_data_count="{{ expired_data_count }}" ></c-sidebar>
    </c-slot>


    <c-command-palette></c-command-palette>

    <div class="p-4 max-w-7xl mx-auto space-y-4">
        <c-page-header title="Dashboard" subtitle="Live attendance tracking for {% if request.GET.date %}{{ selected_date }}{% else %}today{% endif %}."></c-page-header>

        <!-- Filters using cotton components -->
        <c-card padding="sm">
            <c-filter-bar method="get" action="{% url 'admin_panel:dashboard' %}">
                <div class="grid grid-cols-1 {% if can_view_all or branches %}md:grid-cols-3{% else %}md:grid-cols-2{% endif %} gap-3 flex-1 items-end">
                    <c-input type="date" name="date" label="Date" value="{{ selected_date }}" ></c-input>
                    
                    <c-select name="employee" label="Employee" value="{{ selected_employee }}">
                        <option value="">All Employees</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}" {% if selected_employee == emp.id|stringformat:"s" %}selected{% endif %}>{{ emp.full_name }}</option>
                        {% endfor %}
                    </c-select>

                    {% if can_view_all or branches %}
                    <c-select name="branch" label="Branch" value="{{ selected_branch }}">
                        {% if can_view_all %}
                        <option value="">All Branches</option>
                        {% endif %}
                        {% for b in branches %}
                        <option value="{{ b.id }}" {% if selected_branch == b.id|stringformat:"s" %}selected{% endif %}>{{ b.name }}</option>
                        {% endfor %}
                    </c-select>
                    {% endif %}
                </div>

                <c-slot name="actions">
                    <c-button type="submit" variant="primary" icon="filter" label="Filter" ></c-button>
                    <c-button href="{% url 'admin_panel:dashboard' %}" variant="secondary" label="Reset" ></c-button>
                </c-slot>
            </c-filter-bar>
        </c-card>

        <!-- Employee Master Live KPI Section -->
        <div hx-get="{% url 'admin_panel:employee_kpis' %}" hx-trigger="load, every 60s" class="mb-4">
            {% include "admin_panel/partials/employee_kpis.html" %}
        </div>

        <div id="live-section" hx-get="{% url 'admin_panel:dashboard_partial' %}{% if request.GET.urlencode %}?{{ request.GET.urlencode }}{% endif %}" hx-trigger="load, every 60s">
            <!-- Skeleton loader -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
                <c-skeleton type="kpi" ></c-skeleton>
                <c-skeleton type="kpi" ></c-skeleton>
                <c-skeleton type="kpi" ></c-skeleton>
                <c-skeleton type="kpi" ></c-skeleton>
                <c-skeleton type="kpi" ></c-skeleton>
            </div>
            <div class="grid grid-cols-12 gap-6">
                <div class="col-span-12 lg:col-span-7 xl:col-span-8">
                    <c-skeleton type="table" ></c-skeleton>
                </div>
                <div class="col-span-12 lg:col-span-5 xl:col-span-4">
                    <c-skeleton type="card" ></c-skeleton>
                </div>
            </div>
        </div>
        
        <!-- Photo Modal using cotton modal -->
        <c-modal id="photoModal" title="Attendance Photo" size="lg">
            <div class="p-4 flex justify-center items-center bg-slate-900 rounded-btn max-h-[70vh]">
                <img id="modalImg" src="" alt="Zoomed Attendance Photo" class="max-w-full max-h-[60vh] object-contain rounded-btn shadow-sm border border-slate-700">
            </div>
        </c-modal>

        <!-- Photo Modal Script -->
        <script>
            function openPhotoModal(imgUrl, empName) {
                const modalImg = document.getElementById('modalImg');
                if (modalImg) modalImg.src = imgUrl;
                window.dispatchEvent(new CustomEvent('open-modal', { detail: { id: 'photoModal' } }));
            }

            function hidePhotoModal() {
                window.dispatchEvent(new CustomEvent('close-modal', { detail: { id: 'photoModal' } }));
            }
        </script>

        <!-- Dashboard Footer -->
        <footer class="mt-8 pt-4 border-t text-center text-[11px]" style="border-color:var(--border); color:var(--text-muted)">
            Developed by
            <a href="https://tahamidurtaief.com" target="_blank"
               style="color:var(--primary)"
               class="font-semibold hover:underline">Tahamidur Taief</a>
        </footer>
    </div>
</c-app-shell>
