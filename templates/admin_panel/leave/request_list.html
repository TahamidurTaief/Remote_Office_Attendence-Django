<c-app-shell page_title="Leave Requests | FieldTrack Admin" active_href="{{ request.path }}">

    <c-command-palette></c-command-palette>

    <div class="p-3 sm:p-4 max-w-7xl mx-auto space-y-4">
        <c-page-header title="Leave Requests">
            <c-slot name="actions">
                <c-button href="{% url 'leave:admin_balances' %}" variant="secondary" icon="users" label="Balances" ></c-button>
                <c-button href="{% url 'leave:admin_leave_types' %}" variant="secondary" icon="settings" label="Leave Types" ></c-button>
                <c-button hx-get="{% url 'admin_panel:leave_request_create' %}" hx-target="#modal-container" variant="accent" size="sm" icon="plus" label="Add Leave"></c-button>
            </c-slot>
        </c-page-header>
        <!-- Stats grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
            <c-kpi-widget label="Pending Requests" value="{{ pending_count }}" icon="clock" color="warning" ></c-kpi-widget>
            <c-kpi-widget label="Approved Requests" value="{{ approved_count }}" icon="check-circle" color="accent" ></c-kpi-widget>
            <c-kpi-widget label="Rejected Requests" value="{{ rejected_count }}" icon="x-circle" color="danger" ></c-kpi-widget>
        </div>

        <!-- Table Card -->
        <c-card padding="none">
            <div id="leave-request-container" class="overflow-x-auto w-full">
                {% include 'admin_panel/leave/partials/request_list_partial.html' %}
            </div>
        </c-card>
    </div>
<div id="modal-container" @open-modal.window="$nextTick(() => { const m = document.getElementById($event.detail.id); if (m) m.__x.$data.open = true; })"></div>

</c-app-shell>
