<c-modal id="edit-leave-modal" title="Edit Leave Request #{{ object.pk }} (Admin Override)" size="md">
    <form hx-post="{% url 'admin_panel:leave_request_edit' object.pk %}" hx-swap="none" class="space-y-4">
        {% csrf_token %}
        
        <c-select label="EMPLOYEE" name="employee" is_django_form="true" error="{{ form.employee.errors.0 }}">
            {{ form.employee }}
        </c-select>

        <c-select label="LEAVE TYPE" name="leave_type" is_django_form="true" error="{{ form.leave_type.errors.0 }}">
            {{ form.leave_type }}
        </c-select>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <c-select label="START DATE" name="start_date" is_django_form="true" error="{{ form.start_date.errors.0 }}">
                {{ form.start_date }}
            </c-select>
            <c-select label="END DATE" name="end_date" is_django_form="true" error="{{ form.end_date.errors.0 }}">
                {{ form.end_date }}
            </c-select>
        </div>

        <c-select label="REASON" name="reason" is_django_form="true" error="{{ form.reason.errors.0 }}">
            {{ form.reason }}
        </c-select>

        <c-select label="STATUS" name="status" is_django_form="true" error="{{ form.status.errors.0 }}">
            {{ form.status }}
        </c-select>

        <c-slot name="footer">
            <c-button type="button" @click="$dispatch('close-modal')" variant="secondary" size="sm" label="Cancel" ></c-button>
            <c-button type="submit" variant="primary" size="sm" label="Save Changes" extra_class="!bg-[#1877F2] hover:!bg-[#166FE5]" ></c-button>
        </c-slot>
    </form>
</c-modal>
<script>
    window.dispatchEvent(new CustomEvent('open-modal', { detail: { id: 'edit-leave-modal' } }));
</script>
