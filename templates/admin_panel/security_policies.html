<c-app-shell page_title="Per-Role Security Policies | Admin Panel" shell_type="admin" active_href="{{ request.path }}">
  <c-slot name="sidebar">
    <c-sidebar active_href="{{ request.path }}" ></c-sidebar>
  </c-slot>


  <c-command-palette></c-command-palette>

  <div class="p-4 space-y-6 max-w-5xl mx-auto">
    <c-page-header title="Per-Role Security Policies" subtitle="Configure MFA enforcement, unlock methods, re-authentication intervals, and trusted device validity per role.">
      <c-slot name="actions">
        <a href="{% url 'accounts:admin_login_activity' %}" class="ft-btn ft-btn-secondary ft-btn-sm text-xs">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Login Activity &amp; Audit Logs
        </a>
      </c-slot>
    </c-page-header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      {% for policy in policies %}
        <c-security-policy-card :policy="policy"></c-security-policy-card>
      {% endfor %}
    </div>
  </div>
</c-app-shell>
