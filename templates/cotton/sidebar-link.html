<c-vars href="" label="" key="" pinned_keys="" search_match="" is_active="false"></c-vars>

<div class="ft-submenu-item group/menu-item w-full {% if is_active %}active{% endif %}"
     x-show="matchSearch('{{ search_match|default:label }}')"
     onclick="if (!event.target.closest('button')) { const a = this.querySelector('a'); if (a) a.click(); }">
  <a href="{{ href }}"
     class="flex items-center gap-2 flex-1 min-w-0 h-full py-1.5 pl-2 text-inherit no-underline select-none">
    <i data-lucide="circle" class="w-1.5 h-1.5 shrink-0 opacity-60"></i>
    <span class="ft-nav-label">{{ label }}</span>
  </a>
  
  {% if key and request.user.is_authenticated %}
    {% if key in pinned_keys %}
      <button type="button"
              class="p-1 mr-1 rounded transition-all {% if is_active %}text-white hover:text-red-300 hover:bg-white/10 opacity-90 hover:opacity-100{% else %}text-indigo-500 dark:text-indigo-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-slate-100 dark:hover:bg-slate-800 opacity-60 hover:opacity-100{% endif %}"
              title="Unpin {{ label }}"
              onclick="event.preventDefault(); event.stopPropagation(); window.confirmAction('Unpin {{ label }}? It will be removed from Pinned.', () => { htmx.ajax('POST', '{% url 'audit:unpin_menu' %}', {values: {menu_key: '{{ key }}'}, target: '#ft-sidebar', swap: 'outerHTML', headers: {'X-CSRFToken': '{{ csrf_token }}'}}) })">
        <i data-lucide="pin-off" class="w-3.5 h-3.5"></i>
      </button>
    {% else %}
      <button type="button"
              class="p-1 mr-1 rounded transition-all {% if is_active %}text-white hover:bg-white/10 opacity-90 hover:opacity-100{% else %}text-slate-400 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 opacity-40 hover:opacity-100{% endif %}"
              title="Pin {{ label }}"
              onclick="event.preventDefault(); event.stopPropagation(); window.confirmAction('Pin {{ label }}? It will be added to Pinned.', () => { htmx.ajax('POST', '{% url 'audit:pin_menu' %}', {values: {menu_key: '{{ key }}'}, target: '#ft-sidebar', swap: 'outerHTML', headers: {'X-CSRFToken': '{{ csrf_token }}'}}) })">
        <i data-lucide="pin" class="w-3.5 h-3.5"></i>
      </button>
    {% endif %}
  {% endif %}
</div>
