<c-vars id="" label="" icon="" is_active="false" badge="" badge_text="" search_keys="" icon_img="" module=""></c-vars>

<div class="ft-dropdown-group mb-1.5"
     {% if module %}x-show="isModuleVisible('{{ module }}') && matchSearch('{{ search_keys|default:label }}')"{% else %}x-show="matchSearch('{{ search_keys|default:label }}')"{% endif %}>
  <div class="relative group/dropdown">
    <button type="button"
            @click="toggleSubmenu('{{ id }}')"
            class="ft-nav-item w-full flex items-center justify-between {% if is_active %}active{% endif %}"
            :class="{
              'justify-center px-0 mx-auto w-9': collapsed,
              'active': (isSubmenuOpen('{{ id }}') && !collapsed) || (getActiveId() === '{{ id }}' && !currentOpenSubmenu) || {% if is_active %}true{% else %}false{% endif %}
            }"
            :aria-expanded="isSubmenuOpen('{{ id }}')"
            aria-controls="submenu-{{ id }}"
            :title="collapsed ? '{{ label }}' : ''">
      <div class="flex items-center gap-2.5 min-w-0">
        {% if icon_img %}
          <img src="{{ icon_img }}" alt="{{ label }}" class="w-4 h-4 shrink-0 object-contain rounded-sm" loading="eager">
        {% elif icon %}
          <i data-lucide="{{ icon }}" class="ft-icon"></i>
        {% endif %}
        <span class="ft-nav-label font-semibold text-[14px]" x-show="!collapsed" x-cloak>{{ label }}</span>
      </div>
      <div class="flex items-center gap-1.5" x-show="!collapsed" x-cloak>
        {% if badge_text %}
          <span class="px-1.5 py-0.5 text-[11px] font-semibold rounded bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20">{{ badge_text }}</span>
        {% endif %}
        {% if badge %}
          <span class="ft-badge-pill">{{ badge }}</span>
        {% endif %}
        <i data-lucide="chevron-down"
           class="w-4 h-4 transition-transform duration-200 text-slate-400 group-hover/dropdown:text-primary"
           :class="isSubmenuOpen('{{ id }}') ? 'rotate-180 text-primary' : ''"></i>
      </div>
    </button>

    {# Accessible tooltip in collapsed desktop mode #}
    <div x-show="collapsed"
         role="tooltip"
         class="ft-tooltip left-[calc(100%+6px)] top-1/2 -translate-y-1/2 bottom-auto hidden group-hover/dropdown:block"
         x-cloak>
      {{ label }}
    </div>
  </div>

  {# Submenu Container (Phase 2 Menus inside Phase 1 Module) #}
  <div id="submenu-{{ id }}"
       x-show="(isSubmenuOpen('{{ id }}') || search) && !collapsed"
       x-collapse.duration.200ms
       class="pl-2 pr-1 py-1 space-y-1 bg-slate-50/50 dark:bg-slate-900/40 rounded-lg my-1 border border-slate-100 dark:border-slate-800/80"
       x-cloak>
    {{ slot }}
  </div>
</div>
