{# c-backup-stat-card #}
{# Props: #}
{# - type: "emerald" | "sky" | "fuchsia" | "primary" #}
{# - badge_text #}
{# - title #}
{# - icon #}

<div class="relative overflow-hidden border rounded-2xl p-6
    {% if type == 'emerald' %}bg-emerald-50 border-emerald-200
    {% elif type == 'sky' %}bg-sky-50 border-sky-200
    {% elif type == 'fuchsia' %}bg-fuchsia-50 border-fuchsia-200
    {% else %}bg-primary-50 border-primary-200/50{% endif %}">
    
    <div class="flex items-center justify-between">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center
            {% if type == 'emerald' %}bg-emerald-100
            {% elif type == 'sky' %}bg-sky-100
            {% elif type == 'fuchsia' %}bg-fuchsia-100
            {% else %}bg-primary-100{% endif %}">
            
            <i data-lucide="{{ icon }}" class="w-5 h-5 
                {% if type == 'emerald' %}text-emerald-700
                {% elif type == 'sky' %}text-sky-700
                {% elif type == 'fuchsia' %}text-fuchsia-700
                {% else %}text-primary-600{% endif %}"></i>
        </div>
        
        <span class="text-xs font-semibold px-2 py-1 rounded-full
            {% if type == 'emerald' %}text-emerald-700 bg-emerald-200/70
            {% elif type == 'sky' %}text-sky-700 bg-sky-200/70
            {% elif type == 'fuchsia' %}text-fuchsia-700 bg-fuchsia-200/70
            {% else %}text-primary-600 bg-primary-200/70{% endif %}">
            {{ badge_text }}
        </span>
    </div>
    
    <h3 class="mt-4 text-lg font-bold 
        {% if type == 'emerald' %}text-emerald-900
        {% elif type == 'sky' %}text-sky-900
        {% elif type == 'fuchsia' %}text-fuchsia-900
        {% else %}text-primary-800{% endif %}">
        {{ title }}
    </h3>
    
    {{ slot }}
</div>
