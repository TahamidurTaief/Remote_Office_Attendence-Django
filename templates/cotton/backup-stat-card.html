{# c-backup-stat-card #}
{# Props: #}
{# - type: "emerald" | "sky" | "fuchsia" | "primary" #}
{# - badge_text #}
{# - title #}
{# - icon #}

<div class="relative overflow-hidden border rounded-2xl p-5 transition-all
    {% if type == 'emerald' %}bg-emerald-50/80 border-emerald-200 dark:bg-emerald-950/20 dark:border-emerald-800/40
    {% elif type == 'sky' %}bg-sky-50/80 border-sky-200 dark:bg-sky-950/20 dark:border-sky-800/40
    {% elif type == 'fuchsia' %}bg-fuchsia-50/80 border-fuchsia-200 dark:bg-fuchsia-950/20 dark:border-fuchsia-800/40
    {% else %}bg-primary-50/80 border-primary-200/50 dark:bg-primary-950/20 dark:border-primary-800/40{% endif %}">
    
    <div class="flex items-center justify-between">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center
            {% if type == 'emerald' %}bg-emerald-100 dark:bg-emerald-900/40
            {% elif type == 'sky' %}bg-sky-100 dark:bg-sky-900/40
            {% elif type == 'fuchsia' %}bg-fuchsia-100 dark:bg-fuchsia-900/40
            {% else %}bg-primary-100 dark:bg-primary-900/40{% endif %}">
            
            <i data-lucide="{{ icon }}" class="w-5 h-5 
                {% if type == 'emerald' %}text-emerald-700 dark:text-emerald-300
                {% elif type == 'sky' %}text-sky-700 dark:text-sky-300
                {% elif type == 'fuchsia' %}text-fuchsia-700 dark:text-fuchsia-300
                {% else %}text-primary-600 dark:text-primary-300{% endif %}"></i>
        </div>
        
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full
            {% if type == 'emerald' %}text-emerald-700 bg-emerald-200/70 dark:text-emerald-300 dark:bg-emerald-900/60
            {% elif type == 'sky' %}text-sky-700 bg-sky-200/70 dark:text-sky-300 dark:bg-sky-900/60
            {% elif type == 'fuchsia' %}text-fuchsia-700 bg-fuchsia-200/70 dark:text-fuchsia-300 dark:bg-fuchsia-900/60
            {% else %}text-primary-600 bg-primary-200/70 dark:text-primary-300 dark:bg-primary-900/60{% endif %}">
            {{ badge_text }}
        </span>
    </div>
    
    <h3 class="mt-3 text-sm font-bold 
        {% if type == 'emerald' %}text-emerald-900 dark:text-emerald-100
        {% elif type == 'sky' %}text-sky-900 dark:text-sky-100
        {% elif type == 'fuchsia' %}text-fuchsia-900 dark:text-fuchsia-100
        {% else %}text-primary-900 dark:text-primary-100{% endif %}">
        {{ title }}
    </h3>
    
    {{ slot }}
</div>
