{% comment %} c-page-container component
   Props:
   - max_width: max-w-7xl (default) | max-w-5xl | max-w-full
   - extra_class: additional CSS classes
   Slot: page content
{% endcomment %}
<c-vars max_width="max-w-7xl" extra_class="" />
<div class="w-full mx-auto p-3 sm:p-4 md:p-6 space-y-4 {{ max_width|default:'max-w-7xl' }} {{ extra_class }}" {{ attrs }}>
  {{ slot }}
</div>
