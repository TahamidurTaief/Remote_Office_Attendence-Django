{% comment %} c-tab-button component
Props:
- label: tab text
- active_condition: AlpineJS boolean expression for active state
- href: optional link
- extra_class: extra CSS classes
{% endcomment %}

{% if href %}
<a href="{{ href }}"
  class="px-2.5 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer flex items-center gap-1.5 whitespace-nowrap {{ extra_class }}"
  :class="{{ active_condition|default:'false' }} ? 'bg-sky-50 text-blue-600 dark:bg-sky-950/40 dark:text-blue-400 font-bold' : 'bg-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200'"
  {{ attrs }}>
  {% if label %}{{ label }}{% endif %}
  {{ slot }}
</a>
{% else %}
<button type="button"
  class="px-2.5 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer flex items-center gap-1.5 whitespace-nowrap {{ extra_class }}"
  :class="{{ active_condition|default:'false' }} ? 'bg-sky-50 text-blue-600 dark:bg-sky-950/40 dark:text-blue-400 font-bold' : 'bg-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200'"
  {{ attrs }}>
  {% if label %}{{ label }}{% endif %}
  {{ slot }}
</button>
{% endif %}
