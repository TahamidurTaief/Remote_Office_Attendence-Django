{% if error_message %}
  <div class="p-3">
    <c-alert variant="danger" title="Search Error" message="{{ error_message }}"></c-alert>
  </div>
{% elif not results %}
  <c-empty-state
    icon="search-x"
    title="No results found"
    description="No matching records or destinations found. Try searching for roles, permissions, matrix, modules, or menus in English or বাংলা."
  ></c-empty-state>
{% else %}
  <div class="py-1" role="listbox" aria-label="Search suggestions">
    {% for item in results %}
      <c-search-result-row
        href="{{ item.href }}"
        icon="{{ item.icon|default:'arrow-right' }}"
        label="{{ item.label }}"
        group="{{ item.group }}"
        description="{{ item.description|default:'' }}"
      ></c-search-result-row>
    {% endfor %}
  </div>
{% endif %}
