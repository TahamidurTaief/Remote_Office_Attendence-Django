<c-vars policy="" ></c-vars>

<c-card title="{{ policy.role|title }} Policy" subtitle="Configured security rules for {{ policy.role }} role.">
  <form hx-post="{% url 'accounts:admin_security_policies' %}"
        hx-swap="none"
        class="space-y-4 pt-2">
    {% csrf_token %}
    <input type="hidden" name="role" value="{{ policy.role }}">

    <div class="p-3 rounded-lg border bg-slate-900/40 space-y-2 border-slate-800">
      <label class="flex items-center justify-between cursor-pointer">
        <span class="text-xs font-semibold" style="color:var(--text)">Require TOTP MFA</span>
        <input type="checkbox" name="mfa_required" value="true" {% if policy.mfa_required %}checked{% endif %} class="rounded border-slate-700 text-primary focus:ring-primary">
      </label>
      <p class="text-[11px] text-slate-400">Forces users in this role to configure Google Authenticator MFA at login.</p>
    </div>

    <div class="space-y-1">
      <label class="block text-xs font-semibold" style="color:var(--text)">Workspace Unlock Method</label>
      <select name="unlock_method" class="w-full px-3 py-1.5 text-xs rounded bg-slate-900 border border-slate-700 text-white">
        <option value="password" {% if policy.unlock_method == 'password' %}selected{% endif %}>Password Only</option>
        <option value="pin" {% if policy.unlock_method == 'pin' %}selected{% endif %}>Hashed PIN</option>
        <option value="mfa" {% if policy.unlock_method == 'mfa' %}selected{% endif %}>MFA TOTP Code</option>
      </select>
    </div>

    <div class="space-y-1">
      <label class="block text-xs font-semibold" style="color:var(--text)">Re-Auth Interval (Hours)</label>
      <input type="number" name="reauth_interval_hours" value="{{ policy.reauth_interval_hours|default:4 }}" min="0" max="168" class="w-full px-3 py-1.5 text-xs rounded bg-slate-900 border border-slate-700 text-white">
      <p class="text-[11px] text-slate-400">Hours before sensitive actions require re-authentication.</p>
    </div>

    <div class="space-y-1">
      <label class="block text-xs font-semibold" style="color:var(--text)">Trusted Device Duration (Days)</label>
      <input type="number" name="trusted_device_days" value="{{ policy.trusted_device_days|default:30 }}" min="1" max="365" class="w-full px-3 py-1.5 text-xs rounded bg-slate-900 border border-slate-700 text-white">
    </div>

    <button type="submit" class="w-full py-2 px-3 text-xs font-semibold rounded bg-primary hover:bg-primary-dark text-white shadow transition-all">
      Save {{ policy.role|title }} Policy
    </button>
  </form>
</c-card>
