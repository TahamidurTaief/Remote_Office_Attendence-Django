<c-app-shell page_title="Branches | FieldTrack" active_href="{{ request.path }}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{{ request.path }}" />
    </c-slot>

    <c-slot name="topbar">
        <c-topbar title="Branches">
            <c-slot name="actions">
                <c-button href="{% url 'branches:branch_add' %}" variant="accent" icon="plus" label="Add Branch" />
            </c-slot>
        </c-topbar>
    </c-slot>

    <c-command-palette />

    <div class="p-4 max-w-7xl mx-auto space-y-4">
        <!-- Filters -->
        <c-card padding="sm">
            <c-filter-bar method="get" action="{% url 'branches:branch_list' %}">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1 items-end">
                    <c-input name="search" label="Search Branches" value="{{ search }}" placeholder="Branch Name..." />
                    
                    <c-select name="status" label="Status" value="{{ status }}">
                        <option value="">All Statuses</option>
                        <option value="active" {% if status == 'active' %}selected{% endif %}>Active</option>
                        <option value="inactive" {% if status == 'inactive' %}selected{% endif %}>Inactive</option>
                    </c-select>
                </div>
            </c-filter-bar>
        </c-card>

        <!-- Table -->
        <c-card padding="none">
            <div class="overflow-x-auto">
                <table class="ft-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Address</th>
                            <th>Radius</th>
                            <th>Status</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for branch in branches %}
                        <tr>
                            <td>
                                <span class="font-semibold text-xs" style="color:var(--text)">{{ branch.name }}</span>
                            </td>
                            <td>
                                <span class="text-xs truncate max-w-xs block" style="color:var(--text-muted)">{{ branch.address }}</span>
                            </td>
                            <td>
                                <span class="text-xs" style="color:var(--text-secondary)">{{ branch.radius_meters }} m</span>
                            </td>
                            <td>
                                {% if branch.is_active %}
                                    <c-badge variant="success" dot="true" label="Active" />
                                {% else %}
                                    <c-badge variant="neutral" dot="true" label="Inactive" />
                                {% endif %}
                            </td>
                            <td class="text-right">
                                <div class="flex items-center justify-end gap-1">
                                    <a href="{% url 'branches:branch_edit' branch.pk %}" class="ft-btn ft-btn-ghost ft-btn-sm p-1" title="Edit">
                                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                    </a>
                                    {% if branch.is_active %}
                                    <form action="{% url 'branches:branch_delete' branch.pk %}" method="POST" class="inline" x-data @submit.prevent="window.confirmAction('Deactivate this branch?', () => $el.submit())">
                                        {% csrf_token %}
                                        <button type="submit" class="ft-btn ft-btn-ghost ft-btn-sm p-1 text-red-500 hover:text-red-600" title="Deactivate">
                                            <i data-lucide="power" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </form>
                                    {% endif %}
                                </div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="py-12">
                                <c-empty-state icon="building-2" title="No Branches Found" description="Add your first branch to get started." />
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </c-card>
    </div>
</c-app-shell>
