<c-card padding="lg" id="wizard-header-banner">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="space-y-1">
      <div class="flex items-center gap-3">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-gray-100">
          {% if employee %}Edit Employee Lifecycle (Wizard){% else %}New Employee Wizard Setup{% endif %}
        </h1>
        {% if employee %}
          <c-status-pill status="{{ employee.business_status }}" label="{{ employee.business_status_display }}"></c-status-pill>
        {% else %}
          <c-status-pill status="inactive" label="Draft"></c-status-pill>
        {% endif %}
      </div>
      <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">
        Lifecycle-driven 8-step employee setup & profile management.
      </p>
    </div>

    {% if employee %}
    <div class="text-left sm:text-right">
      <span class="text-xs text-gray-400 dark:text-gray-500 font-medium">Profile Completion</span>
      <div class="flex items-center space-x-2 mt-1">
        <div class="w-36 bg-gray-200 dark:bg-gray-700 h-2.5 rounded-full overflow-hidden">
          <div class="bg-[#1877F2] h-2.5 rounded-full transition-all duration-500" style="width: {{ completion_pct }}%;"></div>
        </div>
        <span class="text-sm font-bold text-[#1877F2] font-mono">{{ completion_pct }}%</span>
      </div>
    </div>
    {% endif %}
  </div>
</c-card>
