<form
  id="wizard-step-form"
  method="POST"
  action="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=4 %}{% else %}{% url 'employees:employee_wizard_create_step' step=4 %}{% endif %}"
  hx-post="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=4 %}{% else %}{% url 'employees:employee_wizard_create_step' step=4 %}{% endif %}"
  hx-target="#wizard-root"
  hx-swap="outerHTML transition:true"
  hx-indicator="#wizard-global-loader"
  hx-disabled-elt="#wizard-stepper-banner button, #wizard-step-container button"
  class="space-y-6"
  x-data="{
    pass1: '{{ form.password1.value|default:''|escapejs }}',
    pass2: '{{ form.password2.value|default:''|escapejs }}',
    handleGenerated(pass) {
      this.pass1 = pass;
      this.pass2 = pass;
      const el1 = document.getElementById('id_password1');
      const el2 = document.getElementById('id_password2');
      if (el1) { el1.value = pass; el1.type = 'text'; el1.dispatchEvent(new Event('input', { bubbles: true })); }
      if (el2) { el2.value = pass; el2.type = 'text'; el2.dispatchEvent(new Event('input', { bubbles: true })); }
    }
  }"
  @password-generated.window="handleGenerated($event.detail)"
>
  {% csrf_token %}
  <input type="hidden" name="next_step" value="5">

  <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
    <div>
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Step 4: Security & User Role Assignment</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">Creates User Login Account and assigns dynamic RBAC roles via UserRoleAssignment.</p>
    </div>
    <c-badge variant="success" label="PermissionEngine RBAC Gated"></c-badge>
  </div>

  <c-form-error-summary :form="form" :errors="step_errors"></c-form-error-summary>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
    <div class="md:col-span-2">
      <c-input type="email" name="login_email" id="id_login_email" label="Login Email" required="true" value="{{ form.login_email.value|default:'' }}" error="{{ form.login_email.errors.0 }}" placeholder="user@company.com"></c-input>
    </div>

    <!-- Password Column -->
    <div>
      <c-password-input
        name="password1"
        id="id_password1"
        label="Password"
        required="true"
        placeholder="Set password (min. 6 characters)"
        error="{{ form.password1.errors.0 }}"
        generator_below="true"
        model="pass1"
        value="{{ form.password1.value|default:'' }}"
      ></c-password-input>
    </div>

    <!-- Confirm Password Column -->
    <div>
      <c-password-input
        name="password2"
        id="id_password2"
        label="Confirm Password"
        required="true"
        placeholder="Repeat password"
        error="{{ form.password2.errors.0 }}"
        model="pass2"
        value="{{ form.password2.value|default:'' }}"
      ></c-password-input>
      <div class="mt-1 min-h-[22px] flex items-center">
        <span x-show="pass1 && pass2 && pass1 === pass2" class="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium flex items-center gap-1">
          <svg class="w-3.5 h-3.5 inline text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          Passwords match
        </span>
        <span x-show="pass1 && pass2 && pass1 !== pass2" class="text-[11px] text-rose-500 font-medium flex items-center gap-1">
          <svg class="w-3.5 h-3.5 inline text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          Passwords do not match
        </span>
      </div>
    </div>

    <!-- DYNAMIC ROLE ASSIGNMENT SECTION (Clean, direct container layout) -->
    <div class="md:col-span-2 pt-2">
      <c-employee-roles-picker :field="form.roles" required="true" help_text="Select one or more active RBAC system roles to grant system permissions."></c-employee-roles-picker>
    </div>

    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <c-select name="data_scope" id="id_data_scope" label="Data Scope" value="{{ form.data_scope.value|default:'' }}" error="{{ form.data_scope.errors.0 }}">
          {% for val, label in form.data_scope.field.choices %}
            <option value="{{ val }}" {% if form.data_scope.value == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </c-select>
      </div>

      <div class="flex items-center gap-2 pt-6">
        <c-checkbox name="mfa_required" id="id_mfa_required" label="Require Multi-Factor Authentication (MFA)" checked="{% if form.mfa_required.value %}true{% endif %}"></c-checkbox>
      </div>
    </div>

    <!-- DIRECT CUSTOM PERMISSIONS SECTION (Clean, direct container layout) -->
    <div class="md:col-span-2">
      <c-employee-custom-permissions
        :available_permissions="form.roles.field.available_permissions"
        initial_overrides="{{ form.custom_permissions.value|default:'' }}"
      ></c-employee-custom-permissions>
    </div>
  </div>

  <div class="flex items-center justify-between pt-4 border-t border-slate-200 dark:border-slate-800">
    <c-button 
      type="button" 
      variant="secondary" 
      hx-get="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=3 %}{% else %}{% url 'employees:employee_wizard_create_step' step=3 %}{% endif %}"
      hx-target="#wizard-root" 
      hx-swap="outerHTML transition:true" 
      hx-push-url="true"
      hx-indicator="#wizard-global-loader"
      hx-disabled-elt="#wizard-stepper-banner button, #wizard-step-container button"
      label="Back to Step 3"
    ></c-button>
    <c-button type="submit" variant="primary" icon_right="arrow-right" label="Save & Continue to Step 5"></c-button>
  </div>
</form>
