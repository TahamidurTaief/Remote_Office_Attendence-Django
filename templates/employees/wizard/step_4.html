<form
  id="wizard-step-form"
  hx-post="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=4 %}{% else %}{% url 'employees:employee_wizard_create_step' step=4 %}{% endif %}"
  hx-target="#wizard-root"
  hx-swap="outerHTML"
  hx-indicator="#wizard-global-loader"
  hx-disabled-elt="#wizard-stepper-banner button, #wizard-step-container button"
  class="space-y-6"
  x-data="{
    genPassword() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
      let pass = '';
      for (let i = 0; i < 12; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      this.$refs.pass1.value = pass;
      this.$refs.pass2.value = pass;
      this.$refs.pass1.type = 'text';
      this.$refs.pass2.type = 'text';
    }
  }"
>
  {% csrf_token %}
  <input type="hidden" name="next_step" value="5">

  <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
    <div>
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Step 4: Security & User Role Assignment</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">Creates User Login Account and assigns dynamic RBAC roles via UserRoleAssignment.</p>
    </div>
    <c-badge variant="success" label="PermissionEngine RBAC Gated"></c-badge>
  </div>

  <c-form-error-summary :form="form" :errors="step_errors"></c-form-error-summary>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div class="md:col-span-2">
      <c-input type="email" name="login_email" id="id_login_email" label="Login Email" required="true" value="{{ form.login_email.value|default:'' }}" error="{{ form.login_email.errors.0 }}" placeholder="user@company.com"></c-input>
    </div>

    <div>
      <div class="flex items-center justify-between mb-1">
        <label class="ft-label">Password</label>
        <c-button type="button" variant="ghost" size="sm" label="Generate Strong Password" attrs="@click='genPassword()'"></c-button>
      </div>
      <c-input type="password" name="password1" id="id_password1" placeholder="Set password" error="{{ form.password1.errors.0 }}" attrs="x-ref='pass1'"></c-input>
    </div>

    <div>
      <c-input type="password" name="password2" id="id_password2" label="Confirm Password" placeholder="Repeat password" error="{{ form.password2.errors.0 }}" attrs="x-ref='pass2'"></c-input>
    </div>

    <!-- DYNAMIC ROLE ASSIGNMENT SECTION -->
    <div class="md:col-span-2">
      <c-card padding="md" extra_class="!bg-slate-50/60 dark:!bg-slate-900/40 !border-slate-200 dark:!border-slate-800">
        <c-employee-roles-picker :field="form.roles" required="true" help_text="Select one or more active RBAC system roles to grant system permissions."></c-employee-roles-picker>
      </c-card>
    </div>

    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <c-select name="data_scope" id="id_data_scope" label="Data Scope" value="{{ form.data_scope.value|default:'' }}" error="{{ form.data_scope.errors.0 }}">
          {% for val, label in form.data_scope.field.choices %}
            <option value="{{ val }}" {% if form.data_scope.value == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </c-select>
      </div>

      <div class="flex items-center gap-2 pt-6">
        <c-checkbox name="mfa_required" id="id_mfa_required" label="Require Multi-Factor Authentication (MFA)" checked="{% if form.mfa_required.value %}true{% endif %}"></c-checkbox>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-between pt-4 border-t border-slate-200 dark:border-slate-800">
    <c-button 
      type="button" 
      variant="secondary" 
      hx-post="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=4 %}{% else %}{% url 'employees:employee_wizard_create_step' step=4 %}{% endif %}"
      hx-vals='{"target_step": "3"}'
      hx-include="#wizard-step-form"
      hx-target="#wizard-root" 
      hx-swap="outerHTML" 
      {% if employee %}hx-push-url="{% url 'employees:employee_wizard_step' uuid=employee.uuid step=3 %}"{% else %}hx-push-url="{% url 'employees:employee_wizard_create_step' step=3 %}"{% endif %}
      hx-indicator="#wizard-global-loader"
      hx-disabled-elt="#wizard-stepper-banner button, #wizard-step-container button"
      label="Back to Step 3"
    ></c-button>
    <c-button type="submit" variant="primary" icon_right="arrow-right" label="Save & Continue to Step 5"></c-button>
  </div>
</form>
