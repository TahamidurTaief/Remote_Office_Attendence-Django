<c-card padding="lg" id="wizard-stepper-banner">
  <c-stepper 
    current="{{ step }}" 
    step_count="8"
    clickable="true"
    hx_post_base="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=step %}{% else %}{% url 'employees:employee_wizard_create_step' step=step %}{% endif %}"
    hx_include="#wizard-step-form"
    hx_target="#wizard-root"
    hx_swap="outerHTML"
    step1="Basic Info" 
    step2="Organization" 
    step3="Payroll" 
    step4="Security"
    step5="Documents" 
    step6="Emergency" 
    step7="Assets" 
    step8="Review"
    step1_status="{{ step_statuses.1|default:'pending' }}"
    step2_status="{{ step_statuses.2|default:'pending' }}"
    step3_status="{{ step_statuses.3|default:'pending' }}"
    step4_status="{{ step_statuses.4|default:'pending' }}"
    step5_status="{{ step_statuses.5|default:'pending' }}"
    step6_status="{{ step_statuses.6|default:'pending' }}"
    step7_status="{{ step_statuses.7|default:'pending' }}"
    step8_status="{{ step_statuses.8|default:'pending' }}"
    step1_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=1 %}{% else %}{% url 'employees:employee_wizard' %}{% endif %}"
    step2_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=2 %}{% else %}{% url 'employees:employee_wizard_create_step' step=2 %}{% endif %}"
    step3_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=3 %}{% else %}{% url 'employees:employee_wizard_create_step' step=3 %}{% endif %}"
    step4_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=4 %}{% else %}{% url 'employees:employee_wizard_create_step' step=4 %}{% endif %}"
    step5_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=5 %}{% else %}{% url 'employees:employee_wizard_create_step' step=5 %}{% endif %}"
    step6_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=6 %}{% else %}{% url 'employees:employee_wizard_create_step' step=6 %}{% endif %}"
    step7_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=7 %}{% else %}{% url 'employees:employee_wizard_create_step' step=7 %}{% endif %}"
    step8_url="{% if employee %}{% url 'employees:employee_wizard_step' uuid=employee.uuid step=8 %}{% else %}{% url 'employees:employee_wizard_create_step' step=8 %}{% endif %}"
  ></c-stepper>
</c-card>
