<form 
  hx-post="{% if employee %}{% url 'employees:employee_wizard_step' pk=employee.pk step=1 %}{% else %}{% url 'employees:employee_wizard' %}{% endif %}"
  hx-target="#wizard-step-container"
  hx-swap="innerHTML"
  class="space-y-6"
  enctype="multipart/form-data"
>
  {% csrf_token %}
  <input type="hidden" name="next_step" value="2">

  <div class="flex items-center justify-between border-b border-gray-100 pb-4">
    <div>
      <h2 class="text-lg font-bold text-gray-900">Step 1: Basic Information</h2>
      <p class="text-xs text-gray-500">Core identification fields. Saves employee record as Draft.</p>
    </div>
    <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700">
      Minimum Required Tier
    </span>
  </div>

  {% if form.non_field_errors %}
    <div class="p-3 bg-red-50 text-red-700 text-sm rounded-xl border border-red-200">
      {% for err in form.non_field_errors %}<p>{{ err }}</p>{% endfor %}
    </div>
  {% endif %}

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <c-input type="text" name="employee_number" id="id_employee_number" label="Employee ID" required="true" value="{{ form.employee_number.value|default:'' }}" error="{{ form.employee_number.errors.0 }}"></c-input>
    </div>

    <div>
      <c-select name="gender" id="id_gender" label="Gender" value="{{ form.gender.value|default:'' }}" error="{{ form.gender.errors.0 }}">
        {% for val, label in form.gender.field.choices %}
          <option value="{{ val }}" {% if form.gender.value == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </c-select>
    </div>

    <div>
      <c-input type="text" name="first_name" id="id_first_name" label="First Name" required="true" value="{{ form.first_name.value|default:'' }}" error="{{ form.first_name.errors.0 }}"></c-input>
    </div>

    <div>
      <c-input type="text" name="last_name" id="id_last_name" label="Last Name" required="true" value="{{ form.last_name.value|default:'' }}" error="{{ form.last_name.errors.0 }}"></c-input>
    </div>

    <div>
      <c-input type="email" name="personal_email" id="id_personal_email" label="Personal Email" value="{{ form.personal_email.value|default:'' }}" error="{{ form.personal_email.errors.0 }}"></c-input>
    </div>

    <div>
      <c-input type="tel" name="phone" id="id_phone" label="Phone Number" value="{{ form.phone.value|default:'' }}" error="{{ form.phone.errors.0 }}"></c-input>
    </div>

    <div>
      <c-input type="date" name="dob" id="id_dob" label="Date of Birth" value="{{ form.dob.value|date:'Y-m-d'|default:form.dob.value|default:'' }}" error="{{ form.dob.errors.0 }}"></c-input>
    </div>
  </div>

  <div class="flex items-center justify-end pt-4 border-t" style="border-color:var(--border)">
    <c-button type="submit" variant="primary" icon_right="arrow-right" label="Save & Continue to Step 2" ></c-button>
  </div>
</form>
