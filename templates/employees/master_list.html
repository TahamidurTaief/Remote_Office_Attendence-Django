<c-app-shell page_title="Employee Master (SSOT) | FieldTrack" active_href="{% url 'employees:employee_list' %}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{% url 'employees:employee_list' %}" ></c-sidebar>
    </c-slot>

    <c-slot name="topbar">
        <c-topbar title="Employee Master Directory">
            <c-slot name="actions">
                <a href="{% url 'employees:employee_add' %}" class="inline-flex items-center space-x-1.5 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl transition-colors shadow-sm text-decoration-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>New Employee</span>
                </a>
            </c-slot>
        </c-topbar>
    </c-slot>

    <c-command-palette></c-command-palette>

    <div class="p-4 lg:p-6 w-full space-y-4">
        <!-- Filter Bar -->
        <c-card padding="sm">
            <form method="get" action="{% url 'employees:employee_list' %}" hx-get="{% url 'employees:employee_list' %}" hx-target="#employee-table-container" hx-trigger="keyup changed delay:300ms from:input[name='search'], change from:select" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 items-end">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Search</label>
                    <input type="text" name="search" value="{{ search }}" placeholder="Number, Name, Email, Phone..." class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                    <select name="status" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">All Statuses</option>
                        {% for val, label in statuses %}
                        <option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Branch</label>
                    <select name="branch" class="w-full px-2 py-1 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">All Branches</option>
                        {% for b in branches %}
                        <option value="{{ b.id }}" {% if branch_filter == b.id|stringformat:"s" %}selected{% endif %}>{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Department</label>
                    <select name="department" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">All Departments</option>
                        {% for d in departments %}
                        <option value="{{ d.id }}" {% if dept_filter == d.id|stringformat:"s" %}selected{% endif %}>{{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Designation</label>
                    <select name="designation" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">All Designations</option>
                        {% for des in designations %}
                        <option value="{{ des.id }}" {% if desig_filter == des.id|stringformat:"s" %}selected{% endif %}>{{ des.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </form>
        </c-card>

        <!-- Employee Table container -->
        {% include "employees/partials/master_table.html" %}
    </div>

    <!-- Container for HTMX loaded modals -->
    <div id="modal-container"></div>
</c-app-shell>
