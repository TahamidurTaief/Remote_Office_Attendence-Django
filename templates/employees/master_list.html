<c-app-shell page_title="Employee Master (SSOT) | FieldTrack" active_href="{% url 'employees:employee_list' %}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{% url 'employees:employee_list' %}" ></c-sidebar>
    </c-slot>

    <c-slot name="topbar">
        <c-topbar title="Employee Master Directory">
            <c-slot name="actions">
                <c-button href="{% url 'employees:employee_wizard' %}" variant="primary" icon="plus" label="New Employee" extra_class="!bg-[#1877F2] hover:!bg-[#166FE5]" ></c-button>
            </c-slot>
        </c-topbar>
    </c-slot>

    <c-command-palette></c-command-palette>

    <div class="p-4 lg:p-6 w-full space-y-4">
        <!-- Filter Bar -->
        <c-card padding="sm">
            <c-filter-bar method="get" action="{% url 'employees:employee_list' %}" hx-get="{% url 'employees:employee_list' %}" hx-target="#employee-table-container" hx-trigger="keyup changed delay:300ms from:input[name='search'], change from:select">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 flex-1 items-end">
                    <c-input type="text" name="search" label="Search" value="{{ search }}" placeholder="Number, Name, Email, Phone..." icon="search" ></c-input>

                    <c-select name="status" label="Status" value="{{ status_filter }}">
                        <option value="">All Statuses</option>
                        {% for val, label in statuses %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </c-select>

                    <c-select name="branch" label="Branch" value="{{ branch_filter }}">
                        <option value="">All Branches</option>
                        {% for b in branches %}
                        <option value="{{ b.id }}">{{ b.name }}</option>
                        {% endfor %}
                    </c-select>

                    <c-select name="department" label="Department" value="{{ dept_filter }}">
                        <option value="">All Departments</option>
                        {% for d in departments %}
                        <option value="{{ d.id }}">{{ d.name }}</option>
                        {% endfor %}
                    </c-select>

                    <c-select name="designation" label="Designation" value="{{ desig_filter }}">
                        <option value="">All Designations</option>
                        {% for des in designations %}
                        <option value="{{ des.id }}">{{ des.name }}</option>
                        {% endfor %}
                    </c-select>
                </div>
                <c-slot name="actions"></c-slot>
            </c-filter-bar>
        </c-card>

        <!-- Employee Table container -->
        {% include "employees/partials/master_table.html" %}
    </div>

    <!-- Container for HTMX loaded modals -->
    <div id="modal-container"></div>
</c-app-shell>
