<c-modal id="htmxFormModal" title="Assign Asset to {{ employee.get_full_name }}" size="md">
    <form hx-post="{% url 'employees:asset_assign' employee.pk %}"
          hx-target="#modal-container"
          class="space-y-4">
        {% csrf_token %}
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Select Available Asset *</label>
                {{ form.asset }}
                {{ form.asset.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Assignment Date *</label>
                {{ form.assigned_date }}
                {{ form.assigned_date.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Initial Condition *</label>
                {{ form.condition_at_assignment }}
                {{ form.condition_at_assignment.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Notes</label>
                {{ form.notes }}
                {{ form.notes.errors }}
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
            <c-button type="button" variant="ghost" label="Cancel" @click="$dispatch('close-modal', {id: 'htmxFormModal'})"></c-button>
            <c-button type="submit" variant="primary" label="Assign Asset" icon="check"></c-button>
        </div>
    </form>
</c-modal>
