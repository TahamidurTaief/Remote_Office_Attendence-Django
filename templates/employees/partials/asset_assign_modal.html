<c-modal id="htmxFormModal" title="Assign Asset to {{ employee.get_full_name }}" size="md">
    <form hx-post="{% url 'employees:asset_assign' employee.pk %}"
          hx-target="#form-modal-container"
          class="space-y-4">
        {% csrf_token %}
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Select Available Asset *</label>
                {{ form.asset }}
                {{ form.asset.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Assignment Date *</label>
                {{ form.assigned_date }}
                {{ form.assigned_date.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Initial Condition *</label>
                {{ form.condition_at_assignment }}
                {{ form.condition_at_assignment.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Notes</label>
                {{ form.notes }}
                {{ form.notes.errors }}
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
            <button type="button" @click="$dispatch('close-modal', {id: 'htmxFormModal'})" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold hover:bg-gray-200">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700">Assign Asset</button>
        </div>
    </form>
</c-modal>
