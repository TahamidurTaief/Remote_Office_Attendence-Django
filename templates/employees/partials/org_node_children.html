<div class="w-full flex flex-col items-center">
    <!-- Horizontal connector line -->
    <div class="flex items-center w-full justify-center">
        <div class="w-1/2 h-0.5 bg-gray-300"></div>
        <div class="w-1/2 h-0.5 bg-gray-300"></div>
    </div>
    
    <!-- Children Row -->
    <div class="flex flex-row justify-center items-start gap-8 mt-4 w-full">
        {% for child in directs %}
            <div class="flex flex-col items-center">
                <!-- Vertical line up to parent -->
                <div class="w-0.5 h-6 bg-gray-300 -mt-4 mb-2"></div>
                
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xs p-3 w-64 flex flex-col items-center transition-transform hover:scale-[1.01] duration-150 relative">
                    <div class="mb-2">
                        <c-avatar src="{% if child.profile_photo %}{{ child.profile_photo.url }}{% endif %}" initials="{{ child.first_name|slice:':1' }}{{ child.last_name|slice:':1' }}" size="lg"></c-avatar>
                    </div>
                    <h5 class="font-bold text-slate-900 dark:text-white text-sm mb-0.5">{{ child.get_full_name }}</h5>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider mb-1">{{ child.designation.name|default:"No Designation" }}</p>
                    <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-[9px] text-slate-600 dark:text-slate-300 font-medium">{{ child.department.name|default:"No Department" }}</span>

                    <div class="mt-3 flex items-center gap-1.5">
                        <c-button href="{% url 'employees:master_detail' child.pk %}" variant="secondary" size="sm" label="Profile" extra_class="text-[10px] !px-2 !py-0.5"></c-button>
                        {% if child.direct_reports.exists %}
                            <c-button 
                                hx-get="{% url 'employees:org_chart_node' child.id %}"
                                hx-target="#reports-of-{{ child.id }}"
                                hx-swap="innerHTML"
                                onclick="this.remove()"
                                variant="primary"
                                size="sm"
                                label="Expand"
                                extra_class="text-[10px] !px-2 !py-0.5"></c-button>
                        {% endif %}
                    </div>
                </div>

                <!-- Vertical line down to next level -->
                <div class="w-0.5 h-6 bg-gray-300"></div>

                <!-- Sub-children container -->
                <div id="reports-of-{{ child.id }}" class="w-full flex flex-col items-center"></div>
            </div>
        {% endfor %}
    </div>
</div>
