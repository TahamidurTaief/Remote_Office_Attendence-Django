<c-modal id="htmxFormModal" title="Return Asset: {{ assignment.asset.asset_tag }}" size="md">
    <form hx-post="{% url 'employees:asset_return' assignment.pk %}"
          hx-target="#modal-container"
          class="space-y-4">
        {% csrf_token %}
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Return Date *</label>
                {{ form.returned_date }}
                {{ form.returned_date.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Condition at Return *</label>
                {{ form.condition_at_return }}
                {{ form.condition_at_return.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Return Notes</label>
                {{ form.notes }}
                {{ form.notes.errors }}
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
            <c-button type="button" variant="ghost" label="Cancel" @click="$dispatch('close-modal', {id: 'htmxFormModal'})"></c-button>
            <c-button type="submit" variant="warning" label="Confirm Return" icon="corner-down-left"></c-button>
        </div>
    </form>
</c-modal>
