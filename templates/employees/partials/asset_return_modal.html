<c-modal id="htmxFormModal" title="Return Asset: {{ assignment.asset.asset_tag }}" size="md">
    <form hx-post="{% url 'employees:asset_return' assignment.pk %}"
          hx-target="#form-modal-container"
          class="space-y-4">
        {% csrf_token %}
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Return Date *</label>
                {{ form.returned_date }}
                {{ form.returned_date.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Condition at Return *</label>
                {{ form.condition_at_return }}
                {{ form.condition_at_return.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Return Notes</label>
                {{ form.notes }}
                {{ form.notes.errors }}
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
            <button type="button" @click="$dispatch('close-modal', {id: 'htmxFormModal'})" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold hover:bg-gray-200">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-amber-600 text-white rounded-xl text-xs font-semibold hover:bg-amber-700">Confirm Return</button>
        </div>
    </form>
</c-modal>
