<c-modal id="htmxFormModal" title="Upload Document for {{ employee.get_full_name }}" size="md">
    <form hx-post="{% url 'employees:document_upload' employee.pk %}"
          hx-target="#form-modal-container"
          enctype="multipart/form-data"
          class="space-y-4">
        {% csrf_token %}
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Document Type *</label>
                {{ form.document_type }}
                {{ form.document_type.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Document Title / Note</label>
                {{ form.title }}
                {{ form.title.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">File Attachment *</label>
                {{ form.file }}
                {{ form.file.errors }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Expiry Date (if applicable)</label>
                {{ form.expiry_date }}
                {{ form.expiry_date.errors }}
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
            <button type="button" @click="$dispatch('close-modal', {id: 'htmxFormModal'})" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold hover:bg-gray-200">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700">Upload Document</button>
        </div>
    </form>
</c-modal>
