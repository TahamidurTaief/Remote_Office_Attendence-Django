<c-modal id="employee-confirm-modal" title="{{ title|default:'Confirm Action' }}" size="md">
    <div x-data="{ submitting: false }">
        <form id="employee-confirm-form"
              hx-post="{{ endpoint }}"
              hx-target="#modal-container"
              hx-swap="innerHTML"
              class="space-y-4"
              @submit="submitting = true">
            {% csrf_token %}
            {% if to_status %}
            <input type="hidden" name="to_status" value="{{ to_status }}">
            {% endif %}

            <p class="text-[12px] leading-relaxed text-slate-700 dark:text-slate-300">
                {{ message|default:'Are you sure you want to perform this action?' }}
            </p>

            {% if suspension_dates %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <c-input type="date" name="suspension_start_date" label="Suspension Start Date" required="true" value="{{ today_str }}"></c-input>
                <c-input type="date" name="suspension_end_date" label="Suspension End Date / Expiry Date"></c-input>
            </div>
            <div class="flex items-center gap-2">
                <c-checkbox name="auto_reactivate" id="auto_reactivate" label="Auto-reactivate when expired"></c-checkbox>
            </div>
            {% endif %}

            <div class="space-y-1">
                <c-textarea name="reason" rows="3" label="Reason" placeholder="Enter reason here..." required="{{ reason_required|yesno:'true,false' }}" error="{{ reason_error }}"></c-textarea>
            </div>
        </form>

        <c-slot name="footer">
            <c-button type="button"
                      variant="secondary"
                      size="sm"
                      label="Cancel"
                      extra_class="min-h-[44px]"
                      @click="$dispatch('close-modal', {id: 'employee-confirm-modal'})"></c-button>
            <c-button type="submit"
                      form="employee-confirm-form"
                      variant="{% if action == 'delete' or action == 'suspend' %}danger{% else %}primary{% endif %}"
                      size="sm"
                      label="{{ action_label|default:'Confirm' }}"
                      extra_class="min-h-[44px]"
                      x-bind:disabled="submitting"
                      x-bind:class="{ 'opacity-50 cursor-not-allowed': submitting }"></c-button>
        </c-slot>
    </div>
</c-modal>
