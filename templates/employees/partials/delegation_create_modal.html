<c-modal id="delegation-create-modal" title="Add Manager Delegation" size="md">
    <form action="{% url 'employees:delegation_create' %}" method="post" class="space-y-4">
        {% csrf_token %}

        <div class="space-y-3">
            <c-select name="manager" label="Manager *" required="true">
                <option value="">Select Manager</option>
                {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.get_full_name }} ({{ emp.employee_number }})</option>
                {% endfor %}
            </c-select>

            <c-select name="delegate_to" label="Delegate To *" required="true">
                <option value="">Select Delegate</option>
                {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.get_full_name }} ({{ emp.employee_number }})</option>
                {% endfor %}
            </c-select>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <c-datepicker name="start_date" label="Start Date *" required="true" placeholder="Select Start Date"></c-datepicker>
                <c-datepicker name="end_date" label="End Date *" required="true" placeholder="Select End Date"></c-datepicker>
            </div>

            <c-textarea name="reason" rows="3" label="Reason" placeholder="e.g. Medical Leave delegation..."></c-textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-150 dark:border-slate-800">
            <c-button type="button" @click="$dispatch('close-modal', {id: 'delegation-create-modal'})" variant="secondary" label="Cancel"></c-button>
            <c-button type="submit" variant="primary" label="Save Delegation"></c-button>
        </div>
    </form>
</c-modal>
