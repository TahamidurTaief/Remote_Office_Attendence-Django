<div id="delegation-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50" x-data="{ open: true }" x-show="open">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative mx-4">
        <div class="flex justify-between items-center border-b border-gray-150 pb-3 mb-4">
            <h3 class="text-lg font-bold text-gray-900">Add Manager Delegation</h3>
            <button onclick="document.getElementById('delegation-modal').remove()" class="text-gray-400 hover:text-gray-650 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form action="{% url 'employees:delegation_create' %}" method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Manager</label>
                <select name="manager" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm" required>
                    <option value="">Select Manager</option>
                    {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.get_full_name }} ({{ emp.employee_number }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Delegate To</label>
                <select name="delegate_to" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm" required>
                    <option value="">Select Delegate</option>
                    {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.get_full_name }} ({{ emp.employee_number }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Start Date</label>
                    <input type="date" name="start_date" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">End Date</label>
                    <input type="date" name="end_date" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Reason</label>
                <textarea name="reason" rows="3" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm" placeholder="e.g. Medical Leave delegation..."></textarea>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-150">
                <button type="button" onclick="document.getElementById('delegation-modal').remove()" class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors">
                    Cancel
                </button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-755 text-white text-sm font-semibold rounded-lg transition-colors shadow-sm">
                    Save Delegation
                </button>
            </div>
        </form>
    </div>
</div>
