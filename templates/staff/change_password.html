<c-app-shell page_title="Change Password | FieldTrack" shell_type="staff" active_href="{{ request.path }}">
<div class="px-6 py-8">
  <div class="max-w-md mx-auto">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
      <a href="{% url 'staff:profile' %}" class="p-2 rounded-xl border transition-colors" style="background:var(--surface); border-color:var(--border)">
        <i data-lucide="arrow-left" class="w-5 h-5" style="color:var(--text-secondary)"></i>
      </a>
      <h1 class="text-xl font-bold" style="color:var(--text)">
        Change Password
      </h1>
    </div>

    <!-- Form card -->
    <c-card>
      <form method="POST" class="space-y-4">
        {% csrf_token %}
        <c-input type="password" id="current_password" name="current_password" label="Current Password" placeholder="Enter current password" required="true" />
        <c-input type="password" id="new_password" name="new_password" label="New Password" placeholder="Minimum 8 characters" required="true" />
        <c-input type="password" id="confirm_password" name="confirm_password" label="Confirm New Password" placeholder="Repeat new password" required="true" />
        
        <div class="pt-2">
          <c-button type="submit" variant="primary" label="Update Password" extra_class="w-full justify-center" />
        </div>
      </form>
    </c-card>

    <!-- Security note -->
    <div class="mt-4 p-4 rounded-xl border bg-amber-50 border-amber-200">
      <p class="text-xs text-amber-800 flex gap-2">
        <i data-lucide="shield" class="w-4 h-4 shrink-0"></i>
        <span>Use a strong password with at least 8 characters. You will remain logged in after changing.</span>
      </p>
    </div>
  </div>
</div>
</c-app-shell>
