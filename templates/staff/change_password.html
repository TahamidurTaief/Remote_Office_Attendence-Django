<c-app-shell page_title="Change Password | FieldTrack" shell_type="staff" active_href="{{ request.path }}">
  <div class="px-6 py-8">
    <div class="max-w-md mx-auto space-y-4">
      <!-- Header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <c-button href="{% url 'staff:profile' %}" variant="ghost" size="sm" icon="arrow-left" extra_class="min-h-[44px] min-w-[44px]"></c-button>
          <div>
            <h1 class="text-sm font-bold text-[var(--text)]">Change Password</h1>
            <p class="text-[11px] text-[var(--text-muted)]">Update your login password and terminate other active sessions.</p>
          </div>
        </div>
      </div>

      {% if messages %}
        {% for msg in messages %}
          <c-alert variant="{% if msg.tags == 'error' %}danger{% else %}success{% endif %}" message="{{ msg }}"></c-alert>
        {% endfor %}
      {% endif %}

      <!-- Form card -->
      <c-card>
        <form method="POST" class="space-y-4" novalidate>
          {% csrf_token %}
          <c-password-input
            id="current_password"
            name="current_password"
            label="Current Password"
            placeholder="Enter current password"
            required="true"
            error="{{ errors.current_password|default:'' }}"
          ></c-password-input>

          <c-password-input
            id="new_password"
            name="new_password"
            label="New Password"
            placeholder="Enter new strong password"
            required="true"
            show_generator="true"
            error="{{ errors.new_password|default:'' }}"
          ></c-password-input>

          <c-password-input
            id="confirm_password"
            name="confirm_password"
            label="Confirm New Password"
            placeholder="Repeat new password"
            required="true"
            error="{{ errors.confirm_password|default:'' }}"
          ></c-password-input>

          <div class="pt-2">
            <c-button type="submit" variant="primary" label="Update Password" extra_class="w-full justify-center min-h-[44px]"></c-button>
          </div>
        </form>
      </c-card>

      <!-- Security note -->
      <c-alert variant="warning" title="Security Policy Notice" message="Use a strong password meeting enterprise requirements. Other active device sessions will be invalidated."></c-alert>
    </div>
  </div>
</c-app-shell>
