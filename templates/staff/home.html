<c-app-shell page_title="Home | FieldTrack" shell_type="staff" active_href="{{ request.path }}">
<div id="install-banner" class="hidden mb-4 mx-0">
  <div class="bg-primary rounded-card p-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <img src="/static/icons/icon-72.png" class="w-10 h-10 rounded-xl">
      <div>
        <p class="text-white font-semibold text-sm">Install FieldTrack</p>
        <p class="text-primary-200 text-xs">Add to home screen</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="dismissInstall()" class="text-primary-300 p-1">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
      <button onclick="installPWA()" class="bg-white text-primary-500 text-sm font-semibold px-4 py-2 rounded-xl whitespace-nowrap">
        Install
      </button>
    </div>
  </div>
</div>

<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('pwa_dismissed')) {
    document.getElementById('install-banner')?.classList.remove('hidden');
  }
});
function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then((result) => {
    if (result.outcome === 'accepted') {
      document.getElementById('install-banner')?.classList.add('hidden');
    }
    deferredPrompt = null;
  });
}
function dismissInstall() {
  localStorage.setItem('pwa_dismissed', 'true');
  document.getElementById('install-banner')?.classList.add('hidden');
}
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner')?.classList.add('hidden');
  deferredPrompt = null;
});
</script>

<c-staff-dashboard
  :employee="employee"
  :active_session="active_session"
  :is_checked_in="is_checked_in"
  :total_leave_left="total_leave_left"
  :pending_leave_count="pending_leave_count"
  :pending_tasks="pending_tasks"
  :field_visits="field_visits"
  :my_expenses="my_expenses"
  :unread_notifications="unread_notifications"></c-staff-dashboard>

<c-slot name="scripts">
<script>
function updateClock() {
  const now = new Date();
  const timeEl = document.getElementById('live-time');
  const dateEl = document.getElementById('live-date');
  if (timeEl) {
    timeEl.textContent = now.toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit', hour12: true
    });
  }
  if (dateEl) {
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    dateEl.textContent = `${day}/${month}/${year}`;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    updateClock();
    setInterval(updateClock, 1000);

    if (window.LocationTracker) {
      await LocationTracker.init();
      const isCheckedIn = {{ is_checked_in|yesno:'true,false' }};
      if (isCheckedIn) {
        if (localStorage.getItem('ft_active') !== 'true') {
          LocationTracker.startTracking();
        } else {
          LocationTracker.resume();
        }
        LocationTracker.startCountdown();
      } else {
        LocationTracker.stopTracking();
      }
    }
  } catch (e) {
    console.error('[LocationTracker init failed softly]', e);
  }
});
</script>
</c-slot>
</c-app-shell>
