<c-app-shell page_title="Manager Dashboard | FieldTrack" active_href="{% url 'dashboard' %}">

    <div class="p-4 max-w-7xl mx-auto space-y-4">
    <c-page-header title="Manager Operations">
      <c-slot name="actions">
        <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-600">
        Role: Manager
        </span>
      </c-slot>
    </c-page-header>

    <div id="dashboard-content"
       hx-get="{% url 'dashboard' %}?partial=true{% if request.GET.role_view %}&role_view={{ request.GET.role_view }}{% endif %}"
       hx-trigger="every 30s"
       hx-swap="innerHTML">
    {% include "dashboard/partials/manager_dashboard_content.html" %}
  </div>
  </div>
</c-app-shell>
