<c-app-shell page_title="Manager Dashboard | FieldTrack" active_href="{% url 'dashboard' %}">
  <c-slot name="topbar">
    <c-topbar title="Manager Operations">
      <c-slot name="actions">
        <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-600">
          Role: Manager
        </span>
      </c-slot>
    </c-topbar>
  </c-slot>

  <div class="p-4 max-w-7xl mx-auto space-y-4">
    <!-- Header -->
    <div class="p-4 rounded-xl bg-gradient-to-r from-blue-500/10 via-blue-500/5 to-transparent border border-blue-500/10 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-bold text-slate-800 dark:text-white">
          Team Overview & Approvals
        </h2>
        <p class="text-xs text-slate-500 mt-1">Managing {{ team_count }} direct report employee{{ team_count|pluralize }}.</p>
      </div>
      <div>
        <a href="{% url 'dashboard' %}?role_view=employee" class="ft-btn ft-btn-ghost ft-btn-xs text-xs">
          View My Self Dashboard →
        </a>
      </div>
    </div>

    <!-- Manager KPI Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <c-kpi-widget title="Direct Reports" value="{{ team_count }}" label="Team Members" icon="users" color="blue">
      </c-kpi-widget>

      <c-kpi-widget title="Pending Approvals" value="{{ pending_leave_approvals|length|add:pending_expense_approvals|length }}" label="Action Required" icon="clipboard-check" color="purple">
      </c-kpi-widget>

      <c-kpi-widget title="Managed Projects" value="{{ managed_projects|length }}" label="Active Projects" icon="folder" color="teal">
      </c-kpi-widget>
    </div>

    <!-- Widgets Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div id="widget-manager-attendance">
        {% include "dashboard/widgets/widget_manager_attendance.html" %}
      </div>

      <div id="widget-manager-approvals">
        {% include "dashboard/widgets/widget_manager_approvals.html" %}
      </div>
    </div>
  </div>
</c-app-shell>
