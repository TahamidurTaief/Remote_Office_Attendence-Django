<c-app-shell page_title="Employee Dashboard | FieldTrack" active_href="{% url 'dashboard' %}">
  <c-slot name="topbar">
    <c-topbar title="Employee Portal">
      <c-slot name="actions">
        <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
          Role: Employee
        </span>
      </c-slot>
    </c-topbar>
  </c-slot>

  <div id="dashboard-content" class="p-2 sm:p-4 max-w-7xl mx-auto">
    <c-staff-dashboard
      :employee="employee"
      :active_session="active_session"
      :is_checked_in="is_checked_in"
      :total_leave_left="total_leave_left"
      :pending_leave_count="pending_leave_count"
      :pending_tasks="pending_tasks"
      :field_visits="field_visits"
      :my_expenses="my_expenses"
      :unread_notifications="unread_notifications"></c-staff-dashboard>
  </div>
</c-app-shell>
