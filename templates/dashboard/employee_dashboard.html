<c-app-shell page_title="Employee Dashboard | FieldTrack" active_href="{% url 'dashboard' %}">
  <c-slot name="topbar">
    <c-topbar title="Employee Portal">
      <c-slot name="actions">
        <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
          Role: Employee
        </span>
      </c-slot>
    </c-topbar>
  </c-slot>

  <div id="dashboard-content" 
       class="p-4 max-w-7xl mx-auto space-y-4"
       hx-get="{% url 'dashboard' %}?partial=true{% if request.GET.role_view %}&role_view={{ request.GET.role_view }}{% endif %}"
       hx-trigger="every 30s"
       hx-swap="innerHTML">
    {% include "dashboard/partials/employee_dashboard_content.html" %}
  </div>
</c-app-shell>
