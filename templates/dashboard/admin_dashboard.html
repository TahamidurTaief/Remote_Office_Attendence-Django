<c-app-shell page_title="Admin Executive Dashboard | FieldTrack" active_href="{% url 'dashboard' %}">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <div class="p-4 max-w-7xl mx-auto space-y-4">
    <c-page-header title="Executive Control Panel">
      <c-slot name="actions">
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2">
          <!-- Role View Switcher for Superusers/Admins -->
          <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg text-xs font-semibold">
          <span class="text-slate-400 px-1">View As:</span>
          <a href="{% url 'dashboard' %}?role_view=admin" class="px-2 py-0.5 rounded {% if role_variant == 'admin' %}bg-white dark:bg-slate-700 text-primary shadow-xs{% else %}text-slate-600 dark:text-slate-300{% endif %}">Admin</a>
          <a href="{% url 'dashboard' %}?role_view=hr" class="px-2 py-0.5 rounded {% if role_variant == 'hr' %}bg-white dark:bg-slate-700 text-primary shadow-xs{% else %}text-slate-600 dark:text-slate-300{% endif %}">HR</a>
          <a href="{% url 'dashboard' %}?role_view=manager" class="px-2 py-0.5 rounded {% if role_variant == 'manager' %}bg-white dark:bg-slate-700 text-primary shadow-xs{% else %}text-slate-600 dark:text-slate-300{% endif %}">Manager</a>
          <a href="{% url 'dashboard' %}?role_view=employee" class="px-2 py-0.5 rounded {% if role_variant == 'employee' %}bg-white dark:bg-slate-700 text-primary shadow-xs{% else %}text-slate-600 dark:text-slate-300{% endif %}">Employee</a>
          </div>
          </div>
        </div>
      </c-slot>
    </c-page-header>

    <div id="dashboard-content"
       hx-get="{% url 'dashboard' %}?partial=true{% if request.GET.role_view %}&role_view={{ request.GET.role_view }}{% endif %}"
       hx-trigger="every 30s"
       hx-swap="innerHTML">
    {% include "dashboard/partials/admin_dashboard_content.html" %}
  </div>
  </div>
</c-app-shell>
