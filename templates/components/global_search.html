{# Global Search Component #}
{# Usage: #}
{# {% include "components/global_search.html" %} #}

{% comment %}
  Global Multi-Module Search Component.
  Categories: Customer, Invoice, Employee, Product, Project, Settings, Workflow, Recent.
{% endcomment %}

<div x-data="{
        isOpen: false,
        searchQuery: '',
        activeCategory: 'all',
        focusedIndex: 0,

        records: [
            // Customers
            { id: 'c1', category: 'Customer', title: 'Acme Enterprise Corp', subtitle: 'Enterprise Client • ID #CUST-901', url: '/customers/901/' },
            { id: 'c2', category: 'Customer', title: 'TechCorp International', subtitle: 'SMB Client • ID #CUST-402', url: '/customers/402/' },

            // Invoices
            { id: 'i1', category: 'Invoice', title: 'Invoice #INV-2026-004', subtitle: '$12,450.00 • Paid', url: '/finance/invoices/4/' },
            { id: 'i2', category: 'Invoice', title: 'Invoice #INV-2026-012', subtitle: '$3,800.00 • Pending', url: '/finance/invoices/12/' },

            // Employees
            { id: 'e1', category: 'Employee', title: 'Rahim Uddin', subtitle: 'Senior Backend Engineer • Engineering', url: '/employees/1/' },
            { id: 'e2', category: 'Employee', title: 'Sarah Jenkins', subtitle: 'Product Designer • Design Team', url: '/employees/2/' },

            // Products
            { id: 'p1', category: 'Product', title: 'Enterprise Cloud License', subtitle: 'SaaS Subscription • SK-904', url: '/inventory/items/904/' },

            // Projects
            { id: 'pj1', category: 'Project', title: 'Mobile App Redesign', subtitle: 'Active Sprint • 12 Tasks Pending', url: '/projects/1/' },

            // Settings
            { id: 's1', category: 'Settings', title: 'Payroll Tax Configuration', subtitle: 'System Settings • Tax rules', url: '/admin_panel/' },

            // Workflow
            { id: 'w1', category: 'Workflow', title: 'Leave Approval Automation', subtitle: 'Active Workflow • HR Module', url: '/workflows/1/' },

            // Recent
            { id: 'r1', category: 'Recent', title: 'July Attendance Summary Sheet', subtitle: 'Viewed 10m ago', url: '/staff/attendance/' }
        ],

        get filteredRecords() {
            let list = this.records;
            if (this.activeCategory !== 'all') {
                list = list.filter(r => r.category.toLowerCase() === this.activeCategory);
            }
            if (!this.searchQuery) return list;
            const q = this.searchQuery.toLowerCase();
            return list.filter(r => r.title.toLowerCase().includes(q) || r.subtitle.toLowerCase().includes(q));
        },

        navigateTo(url) {
            this.isOpen = false;
            if (url) window.location.href = url;
        }
     }"
     @open-global-search.window="isOpen = true; $nextTick(() => $refs.searchInput.focus())"
     @keydown.window.escape="if (isOpen) isOpen = false"
     class="relative z-50 font-sans select-none">

    <!-- BACKDROP OVERLAY -->
    <div x-show="isOpen"
         x-transition:enter="transition-opacity ease-out duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-100"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="isOpen = false"
         class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs"
         x-cloak></div>

    <!-- MODAL CONTAINER (Responsive Fullscreen on Mobile / Centered Sheet on Desktop) -->
    <div x-show="isOpen"
         class="fixed inset-0 z-50 p-2 sm:p-6 md:p-16 flex items-start justify-center overflow-y-auto"
         role="dialog"
         aria-modal="true"
         x-cloak>

        <div x-show="isOpen"
             x-transition:enter="transition ease-out duration-150"
             x-transition:enter-start="opacity-0 scale-95 translate-y-2"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-100"
             x-transition:leave-start="opacity-100 scale-100 translate-y-0"
             x-transition:leave-end="opacity-0 scale-95 translate-y-2"
             class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col min-h-[420px]">

            <!-- SEARCH INPUT HEADER -->
            <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
                <svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input x-ref="searchInput"
                       type="text"
                       x-model="searchQuery"
                       placeholder="Search Customers, Invoices, Employees, Products, Projects..."
                       class="w-full bg-transparent border-0 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-0">
                <button type="button" @click="isOpen = false" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>

            <!-- MODULE FILTER TABS -->
            <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-800 flex items-center gap-1 overflow-x-auto scrollbar-none text-xs bg-slate-50/50 dark:bg-slate-900/50">
                <button @click="activeCategory = 'all'" :class="activeCategory === 'all' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">All</button>
                <button @click="activeCategory = 'customer'" :class="activeCategory === 'customer' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">Customer</button>
                <button @click="activeCategory = 'invoice'" :class="activeCategory === 'invoice' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">Invoice</button>
                <button @click="activeCategory = 'employee'" :class="activeCategory === 'employee' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">Employee</button>
                <button @click="activeCategory = 'product'" :class="activeCategory === 'product' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">Product</button>
                <button @click="activeCategory = 'project'" :class="activeCategory === 'project' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">Project</button>
                <button @click="activeCategory = 'workflow'" :class="activeCategory === 'workflow' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">Workflow</button>
                <button @click="activeCategory = 'recent'" :class="activeCategory === 'recent' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold shadow-2xs' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" class="px-2.5 py-1 rounded-md transition-colors whitespace-nowrap">Recent</button>
            </div>

            <!-- SEARCH RESULTS LIST -->
            <div class="flex-1 overflow-y-auto p-2 divide-y divide-slate-100 dark:divide-slate-800/60 max-h-96">
                <template x-for="item in filteredRecords" :key="item.id">
                    <div @click="navigateTo(item.url)"
                         class="p-3 rounded-xl flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors group">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 text-primary-600 dark:text-primary-400 flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs font-semibold text-slate-900 dark:text-slate-100 truncate" x-text="item.title"></p>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate" x-text="item.subtitle"></p>
                            </div>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex-shrink-0" x-text="item.category"></span>
                    </div>
                </template>

                <div x-show="filteredRecords.length === 0" class="py-12 text-center text-xs text-slate-400" x-cloak>
                    No matching records found in search
                </div>
            </div>
        </div>
    </div>
</div>
