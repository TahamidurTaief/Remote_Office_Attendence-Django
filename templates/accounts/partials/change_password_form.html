<div id="change-password-container">
    <form class="space-y-4"
          hx-post="{% url 'accounts:change_password' %}"
          hx-target="#change-password-container"
          hx-swap="outerHTML">
        {% csrf_token %}

        {% if messages %}
          {% for msg in messages %}
            <c-alert variant="{% if msg.tags == 'error' %}danger{% else %}success{% endif %}" message="{{ msg }}"></c-alert>
          {% endfor %}
        {% endif %}

        {% if errors %}
          {% for err in errors %}
            <c-alert variant="danger" message="{{ err }}"></c-alert>
          {% endfor %}
        {% endif %}

        <c-password-input name="old_password" id="old_password" label="Current Password" required="true"></c-password-input>
        <c-password-input name="new_password1" id="new_password1" label="New Password" required="true" show_generator="true"></c-password-input>
        <c-password-input name="new_password2" id="new_password2" label="Confirm New Password" required="true"></c-password-input>

        <div class="pt-3 border-t border-border">
            <c-button type="submit" variant="primary" label="Update Password & Invalidate Other Devices" extra_class="w-full justify-center min-h-[44px]"></c-button>
        </div>
    </form>
</div>
