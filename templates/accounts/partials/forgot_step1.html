<div class="text-center mb-6">
  <div class="inline-flex p-3 rounded-full bg-primary/10 text-primary mb-3">
    <i data-lucide="key-round" class="w-6 h-6"></i>
  </div>
  <h1 class="text-[18px] font-semibold" style="color:var(--text)">Forgot Password</h1>
  <p class="text-[12px] mt-1" style="color:var(--text-secondary)">Enter your email or phone number to receive a 6-digit OTP code.</p>
</div>

{% if error %}
  <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-xs">
    {{ error }}
  </div>
{% endif %}

<form hx-post="{% url 'accounts:forgot_password_request' %}"
      hx-target="#forgot-password-card"
      hx-swap="innerHTML"
      class="space-y-4">
  {% csrf_token %}

  <c-input type="text" id="identifier" name="identifier" label="Email address or Phone number" placeholder="user@example.com or +88017..." required="true" icon="mail" />

  <div class="pt-2">
    <c-button type="submit" variant="primary" label="Send Verification Code" extra_class="w-full justify-center" />
  </div>

  <div class="text-center pt-2">
    <a href="{% url 'accounts:login' %}" class="text-[12px] font-medium text-primary hover:underline flex items-center justify-center gap-1">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Sign In
    </a>
  </div>
</form>
