<div class="text-center mb-6">
  <div class="inline-flex p-3 rounded-full bg-primary/10 text-primary mb-3">
    <i data-lucide="lock" class="w-6 h-6"></i>
  </div>
  <h1 class="text-[18px] font-semibold" style="color:var(--text)">Set New Password</h1>
  <p class="text-[12px] mt-1" style="color:var(--text-secondary)">
    Choose your new password. Any password is allowed.
  </p>
</div>

{% if error %}
  <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-xs">
    {{ error }}
  </div>
{% endif %}

<form hx-post="{% url 'accounts:forgot_password_reset' %}"
      hx-target="#forgot-password-card"
      hx-swap="innerHTML"
      class="space-y-4">
  {% csrf_token %}
  <input type="hidden" name="reset_token" value="{{ reset_token }}">

  <c-password-input name="new_password" id="new_password" label="New Password" placeholder="Enter new password" required="true" show_generator="true" ></c-password-input>
  <c-password-input name="confirm_password" id="confirm_password" label="Confirm Password" placeholder="Re-enter new password" required="true" ></c-password-input>

  <div class="pt-2">
    <c-button type="submit" variant="primary" label="Reset Password & Logout All Devices" extra_class="w-full justify-center" ></c-button>
  </div>
</form>
