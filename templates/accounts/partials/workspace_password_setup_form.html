<form class="space-y-4"
      hx-post="{% url 'accounts:setup_workspace_password' %}"
      hx-target="this"
      hx-swap="outerHTML">
    {% csrf_token %}

    {% if error %}
      <div class="p-3 rounded-lg text-xs bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400">
        {{ error }}
      </div>
    {% endif %}

    {% if success %}
      <div class="p-3 rounded-lg text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400">
        Workspace password successfully {% if ws_password_exists %}updated{% else %}configured{% endif %}!
      </div>
    {% endif %}

    <c-password-input name="password" id="current_password_ws" label="Current Account Password" required="true" ></c-password-input>
    
    <div class="grid grid-cols-2 gap-4">
        <div>
            <c-password-input name="ws_password" id="ws_password" label="New Workspace Password" help="Minimum 6 characters" required="true"></c-password-input>
        </div>
        <div>
            <c-password-input name="confirm_ws_password" id="confirm_ws_password" label="Confirm Workspace Password" required="true"></c-password-input>
        </div>
    </div>

    <div class="pt-3 border-t" style="border-color:var(--border)">
        <c-button type="submit" variant="primary" label="{% if ws_password_exists %}Update Workspace Password{% else %}Save Workspace Password{% endif %}" extra_class="w-full justify-center" ></c-button>
    </div>
</form>
