{% comment %}
  c-reauth-modal partial for HTMX sensitive operation re-authentication
{% endcomment %}
<div id="reauth-modal-container" x-data="{ password: '', errorMessage: '', isSubmitting: false }" class="p-4 space-y-4">
  <div class="text-center space-y-1">
    <div class="w-12 h-12 mx-auto rounded-full bg-amber-500/10 flex items-center justify-center text-amber-500 mb-2">
      <i data-lucide="shield-alert" class="w-6 h-6"></i>
    </div>
    <h3 class="text-base font-bold" style="color:var(--text)">Sensitive Action Re-Authentication</h3>
    <p class="text-xs" style="color:var(--text-secondary)">
      Please confirm your identity with your password or MFA code before proceeding.
    </p>
  </div>

  <form hx-post="{% url 'accounts:security_reauth' %}"
        hx-target="#reauth-modal-container"
        hx-swap="outerHTML"
        class="space-y-3">
    {% csrf_token %}
    <input type="hidden" name="target_url" value="{{ target_url }}">

    {% if reauth_error %}
      <p class="text-xs text-rose-500 font-semibold text-center">{{ reauth_error }}</p>
    {% endif %}

    <div class="space-y-1">
      <label class="block text-xs font-semibold" style="color:var(--text)">Password or MFA Code</label>
      <input type="password"
             name="reauth_credential"
             placeholder="Password / 6-Digit Code"
             required
             autofocus
             class="w-full px-3.5 py-2 text-sm rounded-lg bg-slate-900/50 border border-slate-700 focus:border-primary text-white">
    </div>

    <button type="submit"
            class="w-full py-2 px-4 text-xs font-semibold rounded-lg bg-primary hover:bg-primary-dark text-white shadow transition-all">
      Confirm & Continue
    </button>
  </form>
</div>
