{% comment %} Step 2: Verify TOTP (rendered on error re-render from wizard verify view) {% endcomment %}
<div id="mfa-wizard-body">
  <c-mfa-wizard-step step="2" title="Enter Verification Code">

    <p class="text-xs mb-4" style="color:var(--text-secondary)">
      Enter the 6-digit code from your authenticator app.
    </p>

    {% if error %}
    <div class="mb-3 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-500 text-xs font-semibold flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form
      hx-post="{% url 'accounts:mfa_wizard_verify' %}"
      hx-target="#mfa-wizard-body"
      hx-swap="outerHTML"
      class="space-y-3"
      x-data="{ code: '' }">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-semibold mb-1.5" style="color:var(--text)">6-Digit Verification Code</label>
        <input type="text"
               name="totp_code"
               inputmode="numeric"
               maxlength="6"
               placeholder="123456"
               autofocus
               x-model="code"
               @input="if(code.replace(/\D/g,'').length === 6) $el.closest('form').requestSubmit()"
               class="w-full px-4 py-3 text-center text-xl font-mono font-bold tracking-[0.5em] rounded-xl border focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
               style="background:var(--surface-2); border-color:var(--border); color:var(--text)">
        <p class="text-[11px] mt-1" style="color:var(--text-muted)">Auto-submits when 6 digits entered</p>
      </div>

      <c-button type="submit" variant="primary" label="Verify Code" extra_class="w-full justify-center" />
    </form>

    {# Back to Step 1 — re-fetch QR partial #}
    <button type="button"
            hx-get="{% url 'accounts:mfa_wizard_qr' %}"
            hx-target="#mfa-wizard-body"
            hx-swap="outerHTML"
            class="mt-3 ft-btn ft-btn-ghost ft-btn-sm text-xs w-full justify-center">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to QR Code
    </button>

  </c-mfa-wizard-step>
</div>
