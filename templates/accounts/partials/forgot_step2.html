<div class="text-center mb-6">
  <div class="inline-flex p-3 rounded-full bg-primary/10 text-primary mb-3">
    <i data-lucide="shield-check" class="w-6 h-6"></i>
  </div>
  <h1 class="text-[18px] font-semibold" style="color:var(--text)">Verify OTP Code</h1>
  <p class="text-[12px] mt-1" style="color:var(--text-secondary)">
    If an eligible account matches <strong class="font-semibold">{{ identifier }}</strong>, a 6-digit verification code has been sent to its registered email.
  </p>
</div>

{% if error %}
  <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-xs" role="alert">
    {{ error }}
  </div>
{% endif %}

<form hx-post="{% url 'accounts:forgot_password_verify' %}"
      hx-target="#forgot-password-card"
      hx-swap="innerHTML"
      class="space-y-4">
  {% csrf_token %}
  <input type="hidden" name="reset_token" value="{{ reset_token }}">

  <c-input type="text" id="otp_code" name="otp_code" label="6-Digit OTP Code" placeholder="123456" required="true" icon="lock" ></c-input>

  <div class="pt-2">
    <c-button type="submit" variant="primary" label="Verify & Continue" extra_class="w-full justify-center" ></c-button>
  </div>
</form>

<form hx-post="{% url 'accounts:forgot_password_request' %}"
      hx-target="#forgot-password-card"
      hx-swap="innerHTML"
      class="mt-3 text-center">
  {% csrf_token %}
  <input type="hidden" name="identifier" value="{{ identifier }}">
  <button type="submit" class="text-[12px] font-medium text-primary hover:underline">Resend Verification Code</button>
</form>
