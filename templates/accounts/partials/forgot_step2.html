<div class="text-center mb-6">
  <div class="inline-flex p-3 rounded-full bg-primary/10 text-primary mb-3">
    <i data-lucide="shield-check" class="w-6 h-6"></i>
  </div>
  <h1 class="text-[18px] font-semibold" style="color:var(--text)">Verify OTP Code</h1>
  <p class="text-[12px] mt-1" style="color:var(--text-secondary)">
    We sent a 6-digit code to <strong class="font-semibold">{{ identifier }}</strong>.
  </p>
</div>

{% if debug_otp %}
  <div class="mb-4 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 text-xs text-center font-mono">
    <strong>Dev Helper OTP:</strong> {{ debug_otp }}
  </div>
{% endif %}

{% if error %}
  <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-xs">
    {{ error }}
  </div>
{% endif %}

<form hx-post="{% url 'accounts:forgot_password_verify' %}"
      hx-target="#forgot-password-card"
      hx-swap="innerHTML"
      class="space-y-4">
  {% csrf_token %}
  <input type="hidden" name="reset_token" value="{{ reset_token }}">

  <c-input type="text" id="otp_code" name="otp_code" label="6-Digit OTP Code" placeholder="123456" required="true" icon="lock" />

  <div class="pt-2">
    <c-button type="submit" variant="primary" label="Verify & Continue" extra_class="w-full justify-center" />
  </div>
</form>
