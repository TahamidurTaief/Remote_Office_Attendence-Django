<c-app-shell page_title="Change Password | FieldTrack" active_href="{{ request.path }}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{{ request.path }}" />
    </c-slot>

    <c-slot name="topbar">
        <c-topbar title="Change Password" />
    </c-slot>

    <c-command-palette />

    <div class="p-4 max-w-lg mx-auto space-y-4">
        <c-card title="Update Password" subtitle="Update your account password below.">
            <form class="space-y-4" action="{% url 'accounts:change_password' %}" method="POST">
                {% csrf_token %}

                <c-input type="password" id="old_password" name="old_password" label="Current Password" required="true" />
                <c-input type="password" id="new_password1" name="new_password1" label="New Password" required="true" help="Minimum 8 characters." />
                <c-input type="password" id="new_password2" name="new_password2" label="Confirm New Password" required="true" />

                <div class="pt-3 border-t" style="border-color:var(--border)">
                    <c-button type="submit" variant="primary" label="Update Password" extra_class="w-full justify-center" />
                </div>
            </form>
        </c-card>
    </div>
</c-app-shell>
