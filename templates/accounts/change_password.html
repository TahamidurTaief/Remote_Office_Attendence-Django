<c-app-shell page_title="Change Password | FieldTrack" active_href="{{ request.path }}">
    <c-slot name="sidebar">
        <c-sidebar active_href="{{ request.path }}" ></c-sidebar>
    </c-slot>

    <c-slot name="topbar">
        <c-topbar title="Change Password" ></c-topbar>
    </c-slot>

    <c-command-palette></c-command-palette>

    <div class="p-4 max-w-lg mx-auto space-y-4">
        <c-card title="Update Password" subtitle="Update your account password below. Other active devices will be logged out.">
            <div id="change-password-container">
                <form class="space-y-4"
                      hx-post="{% url 'accounts:change_password' %}"
                      hx-target="#change-password-container"
                      hx-swap="innerHTML">
                    {% csrf_token %}

                    {% if messages %}
                      {% for msg in messages %}
                        <div class="p-3 rounded-lg text-xs {% if msg.tags == 'error' %}bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400{% else %}bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400{% endif %}">
                          {{ msg }}
                        </div>
                      {% endfor %}
                    {% endif %}

                    <c-password-input name="old_password" id="old_password" label="Current Password" required="true" ></c-password-input>
                    <c-password-input name="new_password1" id="new_password1" label="New Password" required="true" show_generator="true" ></c-password-input>
                    <c-password-input name="new_password2" id="new_password2" label="Confirm New Password" required="true" ></c-password-input>

                    <div class="pt-3 border-t" style="border-color:var(--border)">
                        <c-button type="submit" variant="primary" label="Update Password & Invalidate Other Devices" extra_class="w-full justify-center" ></c-button>
                    </div>
                </form>
            </div>
        </c-card>
    </div>
</c-app-shell>
