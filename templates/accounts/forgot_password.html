{% load static tailwind_cli %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      var t = localStorage.getItem('ft_theme');
      if (t === 'dark') { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | FieldTrack</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1877F2">
  {% tailwind_css %}
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  <script src="{% static 'vendor/lucide.min.js' %}"></script>
</head>
<body class="ft-page-bg antialiased min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <c-card>
      <div id="forgot-password-card">
        {% include "accounts/partials/forgot_step1.html" %}
      </div>
    </c-card>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
    document.addEventListener('htmx:afterSwap', () => { if (window.lucide) lucide.createIcons(); });
  </script>
</body>
</html>
