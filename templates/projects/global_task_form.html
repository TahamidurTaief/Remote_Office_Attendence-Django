<c-app-shell page_title="Create Global Task | FieldTrack" active_href="{{ request.path }}">
    <div class="p-4 max-w-3xl mx-auto space-y-4"
         x-data="{
             mode: '{{ form.assignment_mode.value|default:'project' }}',
             startDate: '{{ form.planned_start.value|date:'Y-m-d'|default:form.planned_start.value|default:'' }}',
             finishDate: '{{ form.planned_finish.value|date:'Y-m-d'|default:form.planned_finish.value|default:'' }}',
             duration: '{{ form.duration_days.value|default:'' }}',
             isUpdating: false,

             init() {
                 this.$nextTick(() => {
                     const firstInvalid = document.querySelector('[aria-invalid=\'true\'], .border-red-500, .ft-error-text');
                     if (firstInvalid) {
                         firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                         if (typeof firstInvalid.focus === 'function') firstInvalid.focus();
                     }
                 });
             },

             onStartChange(val) {
                 this.startDate = val;
                 if (this.isUpdating) return;
                 this.isUpdating = true;
                 const dur = parseInt(this.duration, 10);
                 if (this.startDate && !isNaN(dur) && dur >= 1) {
                     this.finishDate = this.addDays(this.startDate, dur - 1);
                 } else if (this.startDate && this.finishDate) {
                     this.recalcDuration();
                 }
                 this.isUpdating = false;
             },

             onDurationChange(val) {
                 this.duration = val;
                 if (this.isUpdating) return;
                 this.isUpdating = true;
                 const dur = parseInt(this.duration, 10);
                 if (this.startDate && !isNaN(dur) && dur >= 1) {
                     this.finishDate = this.addDays(this.startDate, dur - 1);
                 }
                 this.isUpdating = false;
             },

             onFinishChange(val) {
                 this.finishDate = val;
                 if (this.isUpdating) return;
                 this.isUpdating = true;
                 this.recalcDuration();
                 this.isUpdating = false;
             },

             recalcDuration() {
                 if (this.startDate && this.finishDate) {
                     const start = new Date(this.startDate + 'T00:00:00');
                     const finish = new Date(this.finishDate + 'T00:00:00');
                     const diffTime = finish.getTime() - start.getTime();
                     const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
                     if (diffDays >= 1) {
                         this.duration = diffDays;
                     }
                 }
             },

             addDays(dateStr, days) {
                 const d = new Date(dateStr + 'T00:00:00');
                 d.setDate(d.getDate() + days);
                 const year = d.getFullYear();
                 const month = String(d.getMonth() + 1).padStart(2, '0');
                 const day = String(d.getDate()).padStart(2, '0');
                 return `${year}-${month}-${day}`;
             }
         }">
        <!-- Header -->
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">Create Task</h2>
                <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">Create a project-linked task or a standalone single employee task.</p>
            </div>
            <c-button href="{% url 'projects:global_task_list' %}" variant="secondary" size="sm" icon="arrow-left" label="Back to List"></c-button>
        </div>

        <!-- Form Card Component -->
        <c-card padding="md">
            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}

                <!-- Error Summary Component -->
                <c-form-error-summary form="{{ form }}"></c-form-error-summary>

                <!-- Assignment Choice Component -->
                <c-assignment-choice name="assignment_mode" value="{{ form.assignment_mode.value|default:'project' }}"></c-assignment-choice>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-6 pt-1">
                    <!-- Select Project (Project mode only) -->
                    <div class="sm:col-span-6" x-show="mode === 'project'" x-cloak>
                        <c-select name="project" label="Project" is_django_form="true" required="true" error="{{ form.project.errors.0 }}" help="Select the project this task belongs to.">
                            <div hx-get="{% url 'projects:global_task_add' %}" hx-trigger="change from:find select" hx-target="#responsible-person-container" hx-swap="outerHTML" hx-include="[name='assignment_mode'], [name='project']">
                                {{ form.project }}
                            </div>
                        </c-select>
                    </div>

                    <!-- Single Employee Standalone Banner (Employee mode only) -->
                    <div class="sm:col-span-6" x-show="mode === 'employee'" x-cloak>
                        <div class="flex items-center gap-2 p-3 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300">
                            <i data-lucide="info" class="w-4 h-4 text-primary-600 shrink-0"></i>
                            <span>This task will be created as a <strong>Standalone Single Employee Task</strong> without a project.</span>
                        </div>
                    </div>

                    <!-- Sequence Order -->
                    <div class="sm:col-span-2">
                        <c-input type="number" name="order" label="Sequence Order" value="{{ form.order.value|default:'1' }}" required="true" error="{{ form.order.errors.0 }}"></c-input>
                    </div>

                    <!-- Activity Description -->
                    <div class="sm:col-span-4">
                        <c-input type="text" name="activity" label="Activity" value="{{ form.activity.value|default:'' }}" required="true" placeholder="e.g. Duct Installation & Insulation" error="{{ form.activity.errors.0 }}"></c-input>
                    </div>

                    <!-- Responsible Person (Dynamic HTMX Container) -->
                    <div id="responsible-person-container" class="sm:col-span-6">
                        <c-select name="responsible_person" label="Responsible Employee" is_django_form="true" required="true" error="{{ form.responsible_person.errors.0 }}">
                            {{ form.responsible_person }}
                        </c-select>
                    </div>

                    <!-- Planned Start -->
                    <div class="sm:col-span-3">
                        <c-input type="date" name="planned_start" id="planned_start" label="Planned Start Date" value="{{ form.planned_start.value|date:'Y-m-d'|default:form.planned_start.value|default:'' }}" x-model="startDate" @input="onStartChange($event.target.value)" @change="onStartChange($event.target.value)" error="{{ form.planned_start.errors.0 }}"></c-input>
                    </div>

                    <!-- Planned Finish -->
                    <div class="sm:col-span-3">
                        <c-input type="date" name="planned_finish" id="planned_finish" label="Planned Finish Date" value="{{ form.planned_finish.value|date:'Y-m-d'|default:form.planned_finish.value|default:'' }}" x-model="finishDate" :min="startDate || null" @input="onFinishChange($event.target.value)" @change="onFinishChange($event.target.value)" error="{{ form.planned_finish.errors.0 }}"></c-input>
                    </div>

                    <!-- Duration (Days) -->
                    <div class="sm:col-span-3">
                        <c-input type="number" name="duration_days" id="duration_days" label="Duration (Days)" value="{{ form.duration_days.value|default:'' }}" min="1" x-model="duration" @input="onDurationChange($event.target.value)" @change="onDurationChange($event.target.value)" error="{{ form.duration_days.errors.0 }}"></c-input>
                    </div>

                    <!-- Status -->
                    <div class="sm:col-span-3">
                        <c-select name="status" label="Status" is_django_form="true" required="true" error="{{ form.status.errors.0 }}">
                            {{ form.status }}
                        </c-select>
                    </div>

                    <!-- Remarks -->
                    <div class="sm:col-span-6">
                        <c-textarea name="remarks" label="Remarks" rows="3" placeholder="Additional notes or instructions..." error="{{ form.remarks.errors.0 }}">{{ form.remarks.value|default:'' }}</c-textarea>
                    </div>

                    <!-- Attachment -->
                    <div class="sm:col-span-6">
                        <c-file-input name="assignment_attachments" label="Reference File(s) / Attachment(s)" multiple="true" accept=".jpg,.jpeg,.png,.pdf" help="Allowed types: JPG, JPEG, PNG, PDF. Max size: 10MB per file. You can select multiple files." error="{{ form.assignment_attachments.errors.0 }}"></c-file-input>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="flex items-center justify-end gap-2 pt-3 border-t border-gray-150 dark:border-gray-800 mt-4">
                    <c-button href="{% url 'projects:global_task_list' %}" variant="secondary" label="Cancel"></c-button>
                    <c-button type="submit" variant="primary" icon="check" label="Create Task"></c-button>
                </div>
            </form>
        </c-card>
    </div>
</c-app-shell>
